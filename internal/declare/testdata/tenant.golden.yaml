pandokos: v1
kind: tenant
settings:
  time_zone: Europe/Rome
  active_currency: EUR
  metadata_keys:
    - project
    - team
model_restriction:
  models:
    - openai/gpt-4o
roles:
  - name: billing-readers
    description: Reads usage and limits for billing
    permissions:
      - limit:read
      - usage:read
service_accounts:
  - name: billing
    description: Billing exports
    roles:
      - usage-viewer
  - name: reports
    roles:
      - auditor
      - usage-viewer
limits:
  - subject: 'key: tkeyaaaaaaaaaaaaa'
    provider: openai
    model: gpt-4o
    metric: requests_per_minute
    limit: 30
    enforce: true
  - subject:
      mapping:
        scope: tenant
        issuer: corp-idp
        subject: ci-runner
    metric: requests_per_day
    limit: 5
    enforce: true
  - subject: 'service_account: billing'
    metric: tokens_per_day
    limit: 50000
    enforce: false
  - subject: tenant
    metric: requests_per_day
    limit: 1000
    enforce: true
    thresholds:
      - 80
      - 100
price_lists:
  - currency: EUR
    versions:
      - provider: openai
        model: gpt-4o
        valid_from: "2026-01-01T00:00:00Z"
        note: list price 2026
        rates:
          - category: input
            threshold: 0
            rate: "2.50"
          - category: output
            threshold: 0
            rate: "10.00"
      - provider: openai
        model: gpt-4o
        valid_from: "2026-06-01T00:00:00Z"
        rates:
          - category: input
            threshold: 0
            rate: "2.80"
          - category: output
            threshold: 0
            rate: "11.00"
token_issuers:
  - name: corp-idp
    description: The company's identity provider
    issuer: https://idp.example.test
    audience: pandokos-acme
    jwks_uri: ""
    algorithms:
      - ES256
      - RS256
    subject_claim: sub
    required_claims:
      azp: pandokos
      env: prod
    enabled: true
subject_mappings:
  - issuer:
      scope: platform
      name: shared-idp
    subject: svc-reports
    service_account: reports
  - issuer:
      scope: tenant
      name: corp-idp
    subject: ci-runner
    service_account: billing
    description: The CI of the billing team
event_destinations:
  - name: audit-sink
    url: https://sink.example.test/events
    event_types: []
    enabled: false
  - name: hooks
    description: Usage to the billing system
    url: https://hooks.example.test/pandokos
    event_types:
      - io.pandokos.usage.recorded.v1
    enabled: true
