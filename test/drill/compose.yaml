# Started by the drill suite, not for any other use: it starts PostgreSQL servers and a key service
# that the suite destroys. The suite gives the project name (pandokos-drill-<random>) and the
# variables below; nothing here is read by anything else.
#
# fsync stays on in source and target: a recovery is being tested.
services:
  source:
    profiles: [source]
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /backup/wal/%f && cp %p /backup/wal/%f
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${PANDOKOS_DRILL_BACKUP:?started by the drill suite}:/backup
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  target:
    profiles: [target]
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    # With PANDOKOS_DRILL_HOLD_TARGET set the server does not start until the suite has written
    # /backup/target.go: the physical case unpacks a base backup into the data directory first.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$${PANDOKOS_DRILL_HOLD_TARGET:-}" ]; then
          while [ ! -f /backup/target.go ]; do sleep 1; done
        fi
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PANDOKOS_DRILL_HOLD_TARGET: ${PANDOKOS_DRILL_HOLD_TARGET:-}
    secrets:
      - postgres_password
    volumes:
      - ${PANDOKOS_DRILL_BACKUP:?started by the drill suite}:/backup
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 120

  # The later major of the restore on a newer PostgreSQL (the leg of sprint 6.2's R-6).
  target-next:
    profiles: [target-next]
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    command: ["postgres"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${PANDOKOS_DRILL_BACKUP:?started by the drill suite}:/backup
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  openbao:
    profiles: [openbao]
    image: openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
    command: ["server", "-config=/config/openbao.hcl"]
    volumes:
      - ./openbao.hcl:/config/openbao.hcl:ro
      - ${PANDOKOS_DRILL_BACKUP:?started by the drill suite}:/backup
    tmpfs:
      - /openbao/raft
    ports:
      - "127.0.0.1::8200"

  openbao-target:
    profiles: [openbao-target]
    image: openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
    command: ["server", "-config=/config/openbao.hcl"]
    volumes:
      - ./openbao.hcl:/config/openbao.hcl:ro
      - ${PANDOKOS_DRILL_BACKUP:?started by the drill suite}:/backup
    tmpfs:
      - /openbao/raft
    ports:
      - "127.0.0.1::8200"

secrets:
  postgres_password:
    file: ${PANDOKOS_DRILL_SECRETS:?started by the drill suite}/postgres_password
