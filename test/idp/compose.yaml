# Keycloak, Ory Hydra and Authentik for the trusted issuer tests (build tag idp). Started by test/idp/up.sh,
# which generates the certificate, the client secrets and the ports. Not for any other use.
name: pandokos-testidp

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PANDOKOS_TEST_IDP_KEYCLOAK_ADMIN_PASSWORD:?run test/idp/up.sh}
    command:
      - start-dev
      - --http-enabled=false
      - --https-certificate-file=/tls/server.pem
      - --https-certificate-key-file=/tls/server.key
      - --https-port=${PANDOKOS_IDP_KEYCLOAK_PORT:?run test/idp/up.sh}
      - --hostname=https://localhost:${PANDOKOS_IDP_KEYCLOAK_PORT}
      - --import-realm
    volumes:
      - ../../local/idp/tls:/tls:ro
      - ../../local/idp/keycloak-realm.json:/opt/keycloak/data/import/pandokos.json:ro
    ports:
      - "127.0.0.1:${PANDOKOS_IDP_KEYCLOAK_PORT}:${PANDOKOS_IDP_KEYCLOAK_PORT}"

  hydra:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: ["serve", "all", "--sqa-opt-out"]
    environment:
      DSN: memory
      SECRETS_SYSTEM: ${PANDOKOS_IDP_HYDRA_SYSTEM_SECRET:?run test/idp/up.sh}
      URLS_SELF_ISSUER: https://localhost:${PANDOKOS_IDP_HYDRA_PORT}/
      URLS_LOGIN: https://localhost:${PANDOKOS_IDP_HYDRA_PORT}/login
      URLS_CONSENT: https://localhost:${PANDOKOS_IDP_HYDRA_PORT}/consent
      SERVE_PUBLIC_PORT: ${PANDOKOS_IDP_HYDRA_PORT}
      SERVE_PUBLIC_TLS_ENABLED: "true"
      SERVE_PUBLIC_TLS_CERT_PATH: /tls/server.pem
      SERVE_PUBLIC_TLS_KEY_PATH: /tls/server.key
      STRATEGIES_ACCESS_TOKEN: jwt
    volumes:
      - ../../local/idp/tls:/tls:ro
    ports:
      - "127.0.0.1:${PANDOKOS_IDP_HYDRA_PORT}:${PANDOKOS_IDP_HYDRA_PORT}"

  # Authentik (no Redis: it has not needed one since 2025.10). The server serves HTTPS on 9443 with the
  # certificate of up.sh (set as the web certificate of the default brand by the blueprint); the
  # blueprint creates the provider, the application and the service accounts, and reads the secrets
  # from the environment.
  authentik-db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: ${PANDOKOS_IDP_AUTHENTIK_DB_PASSWORD:?run test/idp/up.sh}
    command: ["postgres", "-c", "fsync=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 2s
      timeout: 3s
      retries: 30

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7
    command: server
    healthcheck: &authentik-health
      # The image's own check gives up after about 210 s, before up.sh's waits (and its log dump) do.
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 30s
      start_period: 400s
      retries: 3
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${PANDOKOS_IDP_AUTHENTIK_SECRET_KEY:?run test/idp/up.sh}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PANDOKOS_IDP_AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${PANDOKOS_IDP_AUTHENTIK_ADMIN_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${PANDOKOS_IDP_AUTHENTIK_ADMIN_TOKEN}
      # IPv4 only: the defaults bind [::], which a container without IPv6 refuses.
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__HTTPS: 0.0.0.0:9443
      AUTHENTIK_LISTEN__METRICS: 0.0.0.0:9300
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      PANDOKOS_APP_PASSWORD_A: ${PANDOKOS_TEST_IDP_AUTHENTIK_SECRET_A}
      PANDOKOS_APP_PASSWORD_B: ${PANDOKOS_TEST_IDP_AUTHENTIK_SECRET_B}
      PANDOKOS_APP_PASSWORD_C: ${PANDOKOS_TEST_IDP_AUTHENTIK_SECRET_C}
      PANDOKOS_APP_PASSWORD_UNMAPPED: ${PANDOKOS_TEST_IDP_AUTHENTIK_SECRET_UNMAPPED}
      PANDOKOS_CLIENT_SECRET: ${PANDOKOS_TEST_IDP_AUTHENTIK_CLIENT_SECRET}
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - ./authentik-blueprint.yaml:/blueprints/custom/pandokos.yaml:ro
      - ../../local/idp/tls:/tls:ro
    ports:
      - "127.0.0.1:${PANDOKOS_IDP_AUTHENTIK_PORT}:9443"

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.7@sha256:1675a017c46ba7f4f15333aeafeeb64538c581673bcbcd36af872cdf7de4e7f7
    command: worker
    healthcheck: *authentik-health
    environment: *authentik-env
    depends_on:
      authentik-db:
        condition: service_healthy
    volumes:
      - ./authentik-blueprint.yaml:/blueprints/custom/pandokos.yaml:ro
      - ../../local/idp/tls:/tls:ro
