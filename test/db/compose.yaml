# PostgreSQL and PgBouncer for the test suite. Started by test/db/up.sh. Not for any other use.
name: pandokos-testdb

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /run/pandokos-tls
        install -o postgres -g postgres -m 0644 /tls/server.pem /run/pandokos-tls/server.pem
        install -o postgres -g postgres -m 0600 /tls/server.key /run/pandokos-tls/server.key
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/pandokos-tls/server.pem
      - -c
      - ssl_key_file=/run/pandokos-tls/server.key
    volumes:
      - ../../local/testdb/tls:/tls:ro
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../../local/testdb/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:56432:6432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 1s
      timeout: 3s
      retries: 60

secrets:
  postgres_password:
    file: ../../local/testdb/postgres_password
