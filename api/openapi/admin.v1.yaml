    LimitMetric:
      type: string
      enum: [concurrent_requests, requests_per_minute, tokens_per_minute, requests_per_day, requests_per_month,
             tokens_per_day, tokens_per_month, cost_per_day, cost_per_month]
    LimitSubjectKind:
      type: string
      enum: [tenant, service_account, key]
    LimitEventKind:
      type: string
      enum: [threshold_reached, exhausted]
    LimitRuleLevel:
      type: string
      description: Who owns the rule that recorded the event.
      enum: [tenant, platform]
    LimitAmount:
      type: string
      description: A decimal amount in the currency of the rule, with at most six fraction digits.
      pattern: '^(0|[1-9][0-9]{0,9})(\.[0-9]{1,6})?$'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    TimeZoneName:
      type: string
      maxLength: 64
      pattern: '^([A-Za-z][A-Za-z0-9_+-]{0,31}(/[A-Za-z0-9_+-]{1,31}){0,2})?$'
      description: An IANA time zone name; empty for the default of the installation.
    TenantTimeZone:
      type: object
      additionalProperties: false
      required: [time_zone, in_force]
      properties:
        time_zone: {$ref: '#/components/schemas/TimeZoneName'}
        in_force: {type: string, description: The name of the zone in force now; the default of the installation resolved.}
        effective_from: {type: string, format: date-time, description: Present while a change is pending; the instant from which time_zone is in force.}
    TenantTimeZoneSet:
      type: object
      additionalProperties: false
      required: [time_zone]
      properties:
        time_zone: {$ref: '#/components/schemas/TimeZoneName'}
    LimitState:
      type: string
      enum: [limited, unlimited, unverified, not_evaluated]
    LimitRule:
      type: object
      additionalProperties: false
      required: [id, subject_kind, subject_id, provider, provider_id, model, model_id, metric, limit, amount, currency, enforce, thresholds,
                 active, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        subject_kind: {$ref: '#/components/schemas/LimitSubjectKind'}
        subject_id: {type: string, description: 'Empty for the tenant; a service account ID; a key ID or a subject mapping ID; a key that is revoked cannot be named.'}
        provider: {type: string, description: Empty when the rule is not scoped to a provider.}
        provider_id: {type: string, description: 'Empty when the rule is not scoped to a provider (a model).'}
        model: {type: string, description: Empty when the rule is not scoped to a model.}
        model_id: {type: string, description: 'Empty when the rule is not scoped to a provider (a model).'}
        metric: {$ref: '#/components/schemas/LimitMetric'}
        limit: {type: integer, description: Requests or tokens; 0 for a cost metric.}
        amount: {type: string, description: The budget as a decimal; empty unless a cost metric.}
        currency: {type: string, description: Empty unless a cost metric.}
        enforce: {type: boolean, description: false means the rule never refuses and only records its thresholds.}
        thresholds: {type: array, description: 'Percentages of the limit at which an event is recorded, ascending.', maxItems: 4, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 100}}
        active: {type: boolean, description: 'false for a cost rule whose currency is not the active currency of the tenant in force now; such a rule counts and refuses nothing.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LimitRuleCreate:
      type: object
      additionalProperties: false
      required: [metric]
      properties:
