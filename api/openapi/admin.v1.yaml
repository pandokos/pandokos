# Pandokos administration API, version 1. This document is the source of truth (ADR 0017):
# internal/adminapi is generated from it by `make generate`. It uses the subset of OpenAPI 3.1
# that internal/apigen accepts (docs/reference/admin-api.md).
openapi: 3.1.0
info:
  title: Pandokos administration API
  version: 0.1.0
  description: >-
    Control plane of Pandokos. Every operation needs a virtual key or a platform key in the
    Authorization header and one permission, named in x-pandokos-permission.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - key: []
tags:
  - name: identity
  - name: tenants
  - name: service-accounts
  - name: virtual-keys
  - name: credentials
  - name: tenant-credentials
  - name: catalog
  - name: prices
  - name: model-access
  - name: platform-keys
paths:
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Who the caller is and what it may do
      x-pandokos-permission: identity:read
      responses:
        "200": {$ref: '#/components/responses/Me'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List tenants
      x-pandokos-permission: tenant:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/NamedSort'}
        - name: state
          in: query
          description: Only tenants in this state.
          schema: {$ref: '#/components/schemas/TenantState'}
        - name: name
          in: query
          description: Only the tenant with exactly this name.
          schema: {$ref: '#/components/schemas/Name'}
      responses:
        "200": {$ref: '#/components/responses/TenantList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a tenant with its first administrator
      description: >-
        Creates the tenant, a service account with the role tenant-admin and one virtual key for
        it, and activates the tenant, in one transaction. The key is returned once.
      x-pandokos-permission: tenant:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantCreate'}
      responses:
        "201": {$ref: '#/components/responses/TenantCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Read a tenant
      x-pandokos-permission: tenant:read
      responses:
        "200": {$ref: '#/components/responses/Tenant'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Change the name or the display name of a tenant
      x-pandokos-permission: tenant:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantUpdate'}
      responses:
        "200": {$ref: '#/components/responses/Tenant'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/suspend:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    post:
      operationId: suspendTenant
      tags: [tenants]
      summary: Suspend a tenant
      description: >-
        Blocks inference and administration by the tenant's identities and keeps its data.
        Suspending a suspended tenant succeeds and changes nothing.
      x-pandokos-permission: tenant:suspend
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/Tenant'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/reactivate:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    post:
      operationId: reactivateTenant
      tags: [tenants]
      summary: Reactivate a suspended tenant
      description: Reactivating an active tenant succeeds and changes nothing.
      x-pandokos-permission: tenant:suspend
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/Tenant'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/service-accounts:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listServiceAccounts
      tags: [service-accounts]
      summary: List the service accounts of a tenant
      x-pandokos-permission: service_account:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/NamedSort'}
        - name: state
          in: query
          description: Only service accounts in this state.
          schema: {$ref: '#/components/schemas/ServiceAccountState'}
        - name: name
          in: query
          description: Only the service account with exactly this name.
          schema: {$ref: '#/components/schemas/Name'}
      responses:
        "200": {$ref: '#/components/responses/ServiceAccountList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createServiceAccount
      tags: [service-accounts]
      summary: Create a service account
      x-pandokos-permission: service_account:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountCreate'}
      responses:
        "201": {$ref: '#/components/responses/ServiceAccountCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/service-accounts/{service_account}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/ServiceAccount'}
    get:
      operationId: getServiceAccount
      tags: [service-accounts]
      summary: Read a service account
      x-pandokos-permission: service_account:read
      responses:
        "200": {$ref: '#/components/responses/ServiceAccount'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateServiceAccount
      tags: [service-accounts]
      summary: Change a service account
      description: >-
        Members that are absent are left as they are. valid_from and valid_until accept null,
        which removes the bound. roles replaces the whole set of roles.
      x-pandokos-permission: service_account:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountUpdate'}
      responses:
        "200": {$ref: '#/components/responses/ServiceAccount'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/service-accounts/{service_account}/disable:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/ServiceAccount'}
    post:
      operationId: disableServiceAccount
      tags: [service-accounts]
      summary: Disable a service account
      description: >-
        Every key of the service account stops working. A service account is never deleted.
        Disabling a disabled service account succeeds and changes nothing.
      x-pandokos-permission: service_account:write
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/ServiceAccount'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/service-accounts/{service_account}/enable:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/ServiceAccount'}
    post:
      operationId: enableServiceAccount
      tags: [service-accounts]
      summary: Enable a disabled service account
      description: Enabling an active service account succeeds and changes nothing.
      x-pandokos-permission: service_account:write
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/ServiceAccount'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/virtual-keys:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listVirtualKeys
      tags: [virtual-keys]
      summary: List the virtual keys of a tenant
      x-pandokos-permission: virtual_key:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Sort'}
        - name: state
          in: query
          description: Only keys in this state.
          schema: {$ref: '#/components/schemas/KeyState'}
        - name: service_account_id
          in: query
          description: Only the keys of this service account.
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        "200": {$ref: '#/components/responses/VirtualKeyList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createVirtualKey
      tags: [virtual-keys]
      summary: Issue a virtual key for a service account
      description: >-
        The key is returned once and is stored only as a hash. A service account can hold
        several active keys.
      x-pandokos-permission: virtual_key:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VirtualKeyCreate'}
      responses:
        "201": {$ref: '#/components/responses/VirtualKeyCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/virtual-keys/{key}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/VirtualKey'}
    get:
      operationId: getVirtualKey
      tags: [virtual-keys]
      summary: Read the metadata of a virtual key
      x-pandokos-permission: virtual_key:read
      responses:
        "200": {$ref: '#/components/responses/VirtualKey'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/virtual-keys/{key}/revoke:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/VirtualKey'}
    post:
      operationId: revokeVirtualKey
      tags: [virtual-keys]
      summary: Revoke a virtual key
      description: >-
        Takes effect on every instance within the documented bound. A revocation cannot be
        undone. Revoking a revoked key succeeds and changes nothing.
      x-pandokos-permission: virtual_key:revoke
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/VirtualKey'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/credentials:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List the provider credentials of a tenant (metadata)
      x-pandokos-permission: credential:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Sort'}
        - name: state
          in: query
          description: Only credentials in this state.
          schema: {$ref: '#/components/schemas/CredentialState'}
        - name: provider
          in: query
          description: Only credentials of this provider.
          schema: {$ref: '#/components/schemas/ProviderName'}
      responses:
        "200": {$ref: '#/components/responses/CredentialList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createCredential
      tags: [credentials]
      summary: Register a provider credential
      description: >-
        The secret is encrypted under the data key of the tenant and is never returned, by this
        or by any other operation. The first credential of a provider becomes its default. With
        validate, the secret is first presented to the provider and nothing is stored unless the
        provider accepts it.
      x-pandokos-permission: credential:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialCreate'}
      responses:
        "201": {$ref: '#/components/responses/CredentialCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/CredentialRejected'}
        "500": {$ref: '#/components/responses/Internal'}
        "502": {$ref: '#/components/responses/ValidationUnavailable'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/credentials/{credential}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Credential'}
    get:
      operationId: getCredential
      tags: [credentials]
      summary: Read the metadata of a credential
      x-pandokos-permission: credential:read
      responses:
        "200": {$ref: '#/components/responses/Credential'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateCredential
      tags: [credentials]
      summary: Change the label, the description or the known expiry of a credential
      x-pandokos-permission: credential:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialUpdate'}
      responses:
        "200": {$ref: '#/components/responses/Credential'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a credential
      description: >-
        Removes the row and its sealed secret; the response is the metadata as it was. Refused
        with invalid_state while a virtual key that is neither revoked nor expired is pinned to
        the credential, and while it is the default of a provider that has another credential
        that is not revoked. Pins of revoked and expired keys are cleared.
      x-pandokos-permission: credential:delete
      responses:
        "200": {$ref: '#/components/responses/Credential'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/credentials/{credential}/secret:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Credential'}
    put:
      operationId: replaceCredentialSecret
      tags: [credentials]
      summary: Replace the secret of a credential
      description: >-
        The credential keeps its identifier, label, default flag and pins. The known expiry is
        replaced by the one given, or cleared. A revoked credential is invalid_state.
      x-pandokos-permission: credential:rotate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialSecret'}
      responses:
        "200": {$ref: '#/components/responses/Credential'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/CredentialRejected'}
        "500": {$ref: '#/components/responses/Internal'}
        "502": {$ref: '#/components/responses/ValidationUnavailable'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/credentials/{credential}/disable:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Credential'}
    post:
      operationId: disableCredential
      tags: [credentials]
      summary: Disable a credential
      description: >-
        Takes effect on every instance within the documented bound. Disabling a disabled
        credential changes nothing; a revoked credential is invalid_state. A disabled default
        stays the default: calls for its provider are refused, not moved to another credential.
      x-pandokos-permission: credential:write
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/Credential'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/credentials/{credential}/enable:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Credential'}
    post:
      operationId: enableCredential
      tags: [credentials]
      summary: Enable a disabled credential
      description: Enabling an active credential changes nothing; a revoked credential is invalid_state.
      x-pandokos-permission: credential:write
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/Credential'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
