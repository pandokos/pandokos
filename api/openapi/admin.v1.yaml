    NotFound:
      description: 'The resource does not exist or belongs to another tenant; the two cases are identical. Code: not_found.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: 'The name is taken (code conflict) or the resource is in a state that does not allow the operation (code invalid_state); the first request with the same Idempotency-Key is still running (code idempotency_in_progress, with Retry-After) or succeeded and its response was not kept (code idempotency_response_lost).'
