    Forbidden:
      description: 'The caller lacks the permission (code forbidden) or its tenant is not active (code tenant_suspended); the session must change its password first (code password_change_required); the checks of origin and request forgery failed (code csrf_rejected); the sign-in method is off or the origin of the listener is not known (code sign_in_disabled); the caller tried to give or take a permission it does not hold (code escalation_refused); support actions are switched off (code support_disabled).'
