  schemas:
    ApiFamily:
      type: string
      description: The wire protocol of a provider.
      enum: [openai, anthropic]
    ModelName:
      type: string
      description: 'The public name callers send: letters, digits and . _ : @ / + -, 1 to 128 characters.'
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/+-]{0,127}$'
    ModelRef:
      type: string
      description: A model named as provider/name.
      pattern: '^[a-z][a-z0-9-]{0,62}/[A-Za-z0-9][A-Za-z0-9._:@/+-]{0,127}$'
    ModelStatus:
      type: string
      description: active; deprecated (still callable, flagged); retired (callable by nobody).
      enum: [active, deprecated, retired]
    ModelAvailability:
      type: string
      description: all tenants, or the tenants the model is granted to.
      enum: [all, selected]
    PriceSource:
      type: string
      enum: [import, override]
    PriceCategory:
      type: string
      description: The units a rate applies to.
      enum: [input, output, cache_read, cache_write, cache_write_1h, input_audio, output_audio]
    PriceImportSource:
      type: string
      enum: [embedded, file, remote]
    PriceImportRunSource:
      type: string
      enum: [embedded, remote]
    StreamUsageOption:
      type: string
      description: add (default) adds the stream usage option to chat completion streams that do not ask for usage; omit never adds it. Only add is accepted for a provider of family anthropic.
      enum: [add, omit]
    CredentialAvailability:
      type: string
      enum: [active, missing, disabled, revoked]
    BudgetAvailability:
      type: string
      description: not_enforced when no enforced quota or budget in force matches (a budget in another currency than the tenant's active currency is not in force); unpriced when a budget matches and the model has no price in the active currency; exhausted when a matching quota or budget is used up for the current period.
      enum: [not_enforced, available, exhausted, unpriced]
    CapabilityChecks:
      type: object
      additionalProperties: false
      required: [provider_available, model_allowed, credential, credential_validated, budget]
      properties:
        provider_available: {type: boolean}
        model_allowed: {type: boolean}
        credential: {$ref: '#/components/schemas/CredentialAvailability'}
        credential_id: {type: string, description: The default credential of the tenant for the provider; absent when there is none.}
        credential_validated: {type: boolean, description: The credential was accepted by the provider when it was stored or replaced. Informational.}
        budget: {$ref: '#/components/schemas/BudgetAvailability'}
    Capability:
      type: object
      additionalProperties: false
      required: [provider, model, callable, reasons, checks, checked_at]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        model: {$ref: '#/components/schemas/ModelName'}
        callable: {type: boolean}
        reasons:
          type: array
          description: 'Every failing check, in this order: provider_unavailable, model_not_allowed, no_credential, credential_disabled, credential_revoked, no_price, budget_exhausted. Empty when callable.'
          items: {type: string}
        checks: {$ref: '#/components/schemas/CapabilityChecks'}
        checked_at: {type: string, format: date-time}
    UsageCounter:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: integer}
    MetadataEntry:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key: {type: string}
        value: {type: string}
    UsageRecord:
      type: object
      additionalProperties: false
      required: [id, request_id, trace_id, started_at, duration_ms, principal_kind, principal_id, key_id, credential_id,
                 provider, api_family, operation, endpoint, model, model_id, upstream_model, stream, outcome,
                 error_code, upstream_status, ttfb_ms, request_bytes, response_bytes, input_source, output_source,
                 input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens,
                 estimated_input_tokens, estimated_output_tokens, other_units, provider_usage, cost_status, cost_reason,
                 currency, price_version_id, price_source, cost_fallbacks, metadata, metadata_dropped, limit_state]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        request_id: {type: string}
        trace_id: {type: string, description: Empty when the request had no trace.}
        started_at: {type: string, format: date-time}
        duration_ms: {type: integer}
        principal_kind: {type: string}
        principal_id: {type: string}
        key_id: {type: string}
        credential_id: {type: string, description: Empty when no credential was opened.}
        provider: {type: string}
        api_family: {type: string}
        operation: {type: string}
        endpoint: {type: string}
        model: {type: string}
        model_id: {type: string}
        upstream_model: {type: string}
        stream: {type: boolean, description: False also when the request was refused before its body was read.}
        outcome: {type: string}
        error_code: {type: string}
        upstream_status: {type: integer, description: 0 when the provider did not answer.}
        ttfb_ms: {type: integer, description: 0 when no body byte arrived.}
        request_bytes: {type: integer}
        response_bytes: {type: integer}
        input_source: {type: string, description: 'provider, estimated or none.'}
        output_source: {type: string, description: 'provider, estimated or none.'}
        input_tokens: {type: integer, description: Reported by the provider; 0 unless input_source is provider. Includes cache_read_tokens and cache_write_tokens.}
        output_tokens: {type: integer, description: Reported by the provider; 0 unless output_source is provider. Includes reasoning_tokens.}
        cache_read_tokens: {type: integer}
        cache_write_tokens: {type: integer}
        reasoning_tokens: {type: integer}
        estimated_input_tokens: {type: integer, description: 0 unless input_source is estimated.}
        estimated_output_tokens: {type: integer, description: 0 unless output_source is estimated.}
        other_units:
          type: array
          items: {$ref: '#/components/schemas/UsageCounter'}
        provider_usage:
          type: array
          description: The provider's own integer counters, by path.
          items: {$ref: '#/components/schemas/UsageCounter'}
        cost_status: {type: string, description: 'known, unknown or none.'}
        cost_reason: {type: string}
        cost: {type: [string, "null"], description: Decimal amount in currency; null unless cost_status is known. Informational under BYOK.}
        currency: {type: string}
        price_version_id: {type: string}
        price_source: {type: string, description: 'catalogue or tenant: the price list price_version_id belongs to; empty when the record has no price version.'}
        cost_fallbacks:
          type: array
          items: {type: string}
        metadata:
          type: array
          items: {$ref: '#/components/schemas/MetadataEntry'}
        metadata_dropped: {type: integer}
        limit_state: {type: string, description: 'limited, unlimited, unverified or not_evaluated; empty for a record written before the field existed.'}
    UsageRecordList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UsageRecord'}
        next_cursor: {type: string, description: Absent on the last page.}
    Provider:
      type: object
      additionalProperties: false
      required: [id, name, display_name, description, api_family, enabled, dataset_provider, stream_usage_option, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {$ref: '#/components/schemas/ProviderName'}
        display_name: {type: string}
        description: {type: string}
        api_family: {$ref: '#/components/schemas/ApiFamily'}
        enabled: {type: boolean}
        dataset_provider: {type: string, description: Identifier of the provider in the price dataset; empty when its prices are not imported.}
        stream_usage_option: {$ref: '#/components/schemas/StreamUsageOption'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProviderCreate:
      type: object
      additionalProperties: false
      required: [name, api_family]
      properties:
        name: {$ref: '#/components/schemas/ProviderName'}
        api_family: {$ref: '#/components/schemas/ApiFamily'}
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 500}
        dataset_provider: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'}
        stream_usage_option: {$ref: '#/components/schemas/StreamUsageOption'}
    ProviderUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 500}
        enabled: {type: boolean}
        dataset_provider: {type: string, pattern: '^([a-z0-9][a-z0-9_.-]{0,62})?$', description: Empty stops imports for the provider.}
        stream_usage_option: {$ref: '#/components/schemas/StreamUsageOption'}
    ProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Provider'}
        next_cursor: {type: string, description: Absent on the last page.}
    Endpoint:
      type: object
      additionalProperties: false
      required: [id, provider, name, base_url, region, private, enabled, is_default, description, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        name: {$ref: '#/components/schemas/Name'}
        base_url: {type: string, description: The native path of a request is appended to it.}
        region: {type: string}
        private: {type: boolean, description: Declared by the platform administrator to be on a private network.}
        enabled: {type: boolean}
        is_default: {type: boolean, description: The endpoint the gateway uses for the provider.}
        description: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EndpointCreate:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        base_url: {type: string, minLength: 8, maxLength: 2048, pattern: '^https?://[^/?#@\s]+(/[^?#\s]*)?$'}
        region: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
        private: {type: boolean}
        is_default: {type: boolean}
        description: {type: string, maxLength: 500}
    EndpointUpdate:
      type: object
      additionalProperties: false
      properties:
        base_url: {type: string, minLength: 8, maxLength: 2048, pattern: '^https?://[^/?#@\s]+(/[^?#\s]*)?$'}
        region: {type: string, pattern: '^([a-z0-9][a-z0-9-]{0,62})?$'}
        private: {type: boolean}
        enabled: {type: boolean}
        is_default: {type: boolean, description: true makes this the default; false is refused for the default (make another one the default instead).}
        description: {type: string, maxLength: 500}
    EndpointList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Endpoint'}
        next_cursor: {type: string, description: Absent on the last page.}
    Model:
      type: object
      additionalProperties: false
      required: [id, provider, api_family, name, ref, upstream_id, display_name, description, status, availability, capabilities, context_window, max_output_tokens, default_output_tokens, price_override, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        api_family: {$ref: '#/components/schemas/ApiFamily'}
        name: {$ref: '#/components/schemas/ModelName'}
        ref: {$ref: '#/components/schemas/ModelRef'}
        upstream_id: {type: string, description: The identifier the provider receives.}
        display_name: {type: string}
        description: {type: string}
        status: {$ref: '#/components/schemas/ModelStatus'}
        availability: {$ref: '#/components/schemas/ModelAvailability'}
        capabilities:
          type: array
          items: {type: string}
        context_window: {type: integer, description: In tokens; 0 when not known.}
        max_output_tokens: {type: integer, description: In tokens; 0 when not known.}
        default_output_tokens: {type: integer, description: In tokens; 0 when not set.}
        price_override: {type: boolean, description: An operator price is in place and imports leave the model alone.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ModelCreate:
      type: object
      additionalProperties: false
      required: [provider, name]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        name: {$ref: '#/components/schemas/ModelName'}
        upstream_id: {type: string, maxLength: 256, pattern: '^[!-~]+$'}
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
        status: {$ref: '#/components/schemas/ModelStatus'}
        availability: {$ref: '#/components/schemas/ModelAvailability'}
        capabilities:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, pattern: '^(text|vision|audio|tools|reasoning|embeddings|structured_output|streaming)$'}
        context_window: {type: integer, minimum: 0, maximum: 100000000}
        max_output_tokens: {type: integer, minimum: 0, maximum: 100000000}
        default_output_tokens: {type: integer, minimum: 0, maximum: 1000000}
    ModelUpdate:
      type: object
      additionalProperties: false
      properties:
        upstream_id: {type: string, maxLength: 256, pattern: '^[!-~]+$'}
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
        status: {$ref: '#/components/schemas/ModelStatus'}
        availability: {$ref: '#/components/schemas/ModelAvailability'}
        capabilities:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, pattern: '^(text|vision|audio|tools|reasoning|embeddings|structured_output|streaming)$'}
        context_window: {type: integer, minimum: 0, maximum: 100000000, description: 0 clears it.}
        max_output_tokens: {type: integer, minimum: 0, maximum: 100000000, description: 0 clears it.}
        default_output_tokens: {type: integer, minimum: 0, maximum: 1000000, description: 0 clears it.}
    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Model'}
        next_cursor: {type: string, description: Absent on the last page.}
    ModelGrant:
      type: object
      additionalProperties: false
      required: [model_id, tenant_id, tenant_name, created_at]
      properties:
        model_id: {$ref: '#/components/schemas/ID'}
        tenant_id: {$ref: '#/components/schemas/ID'}
        tenant_name: {$ref: '#/components/schemas/Name'}
        created_at: {type: string, format: date-time}
    ModelGrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelGrant'}
        next_cursor: {type: string, description: Absent on the last page.}
    PriceRate:
      type: object
      additionalProperties: false
      required: [category, threshold, rate]
      properties:
        category: {$ref: '#/components/schemas/PriceCategory'}
        threshold: {type: integer, minimum: 0, maximum: 100000000, description: 'Input tokens of a request from which this rate applies to every unit of the category; 0 for the base rate.'}
        rate: {type: string, pattern: '^(0|[1-9][0-9]{0,6})(\.[0-9]{1,12})?$', description: 'Price per million units, as a decimal string, in the currency of the version.'}
    PriceVersion:
      type: object
      additionalProperties: false
      required: [id, model_id, valid_from, currency, source, note, rates, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        model_id: {$ref: '#/components/schemas/ID'}
        valid_from: {type: string, format: date-time}
        currency: {type: string, description: ISO 4217 code.}
        source: {$ref: '#/components/schemas/PriceSource'}
        import_id: {$ref: '#/components/schemas/ID'}
        note: {type: string}
        rates:
          type: array
          items: {$ref: '#/components/schemas/PriceRate'}
        created_at: {type: string, format: date-time}
    PriceVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PriceVersion'}
        next_cursor: {type: string, description: Absent on the last page.}
    PriceOverride:
      type: object
      additionalProperties: false
      required: [currency, rates]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        valid_from: {type: string, format: date-time, description: Now when absent; never in the past.}
        note: {type: string, maxLength: 500}
        rates:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/PriceRate'}
    TenantPriceKind:
      type: string
      description: price carries rates; end carries none, and from its start the list does not price the model.
      enum: [price, end]
    CurrencyOrDefault:
      type: string
      pattern: '^([A-Z]{3})?$'
      description: An ISO 4217 code; empty for the default currency of the installation.
    TenantPriceVersion:
      type: object
      additionalProperties: false
      required: [id, model_id, provider, model, kind, valid_from, currency, rates, note, in_force, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        model_id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        model: {$ref: '#/components/schemas/ModelName'}
        kind: {$ref: '#/components/schemas/TenantPriceKind'}
        valid_from: {type: string, format: date-time}
        currency: {$ref: '#/components/schemas/Currency'}
        rates:
          type: array
          items: {$ref: '#/components/schemas/PriceRate'}
        note: {type: string}
        in_force: {type: boolean, description: true when this is the version of its list and model in force now. A list is used only while its currency is the active currency.}
        created_at: {type: string, format: date-time}
    TenantPriceVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TenantPriceVersion'}
        next_cursor: {type: string, description: Absent on the last page.}
    TenantPriceCreate:
      type: object
      additionalProperties: false
      required: [provider, model, currency]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        model: {$ref: '#/components/schemas/ModelName'}
        currency: {$ref: '#/components/schemas/Currency'}
        kind: {$ref: '#/components/schemas/TenantPriceKind'}
        valid_from: {type: string, format: date-time, description: Now when absent; never in the past.}
        note: {type: string, maxLength: 500}
        rates:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/PriceRate'}
    TenantPriceList:
      type: object
      additionalProperties: false
      required: [currency, versions, models_priced, active]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        versions: {type: integer, description: Versions of the list, past ones included.}
        models_priced: {type: integer, description: Models the list prices now.}
        active: {type: boolean, description: true when the currency of the list is the active currency in force.}
    TenantPriceListList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TenantPriceList'}
    InactiveLimit:
      type: object
      additionalProperties: false
      required: [level, rule_id, metric, currency]
      properties:
        level: {type: string, description: 'platform (a ceiling) or tenant (a rule of the tenant).'}
        rule_id: {$ref: '#/components/schemas/ID'}
        metric: {$ref: '#/components/schemas/LimitMetric'}
        currency: {$ref: '#/components/schemas/Currency'}
    ActiveCurrency:
      type: object
      additionalProperties: false
      required: [currency, in_force]
      properties:
        currency: {$ref: '#/components/schemas/CurrencyOrDefault'}
        in_force: {$ref: '#/components/schemas/Currency'}
        effective_from: {type: string, format: date-time, description: Present while a change is pending; the instant from which currency is in force.}
        inactive_limits:
          type: array
          maxItems: 100
          description: >-
            Only in the answer to a change: the cost rules of the tenant and the ceilings of the
            platform that apply to it whose currency is not the new one. From effective_from they
            are inactive: they count nothing and refuse nothing.
          items: {$ref: '#/components/schemas/InactiveLimit'}
    ActiveCurrencySet:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency: {$ref: '#/components/schemas/CurrencyOrDefault'}
    PriceImportIssue:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string}
        detail: {type: string}
    PriceImportItem:
      type: object
      additionalProperties: false
      required: [provider, model, outcome]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        model: {$ref: '#/components/schemas/ModelName'}
        dataset_model: {type: string}
        outcome: {type: string, description: 'created, unchanged, overridden, unmatched or skipped.'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/PriceImportIssue'}
    PriceImport:
      type: object
      additionalProperties: false
      required: [source, dataset_format, outcome, models_seen, versions_created, unchanged, overridden, unmatched, skipped, started_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        source: {$ref: '#/components/schemas/PriceImportSource'}
        source_ref: {type: string}
        dataset_format: {type: string}
        digest: {type: string, description: SHA-256 of the dataset, hexadecimal.}
        outcome: {type: string, description: success or failure.}
        error_class: {type: string}
        actor_type: {type: string}
        models_seen: {type: integer}
        versions_created: {type: integer}
        unchanged: {type: integer}
        overridden: {type: integer}
        unmatched: {type: integer}
        skipped: {type: integer}
        dry_run: {type: boolean}
        items:
          type: array
          description: The report; absent in lists.
          items: {$ref: '#/components/schemas/PriceImportItem'}
        truncated: {type: integer, description: Report items left out because the report reached its size limit.}
        started_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    PriceImportRun:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: {$ref: '#/components/schemas/PriceImportRunSource'}
        dry_run: {type: boolean}
    PriceImportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PriceImport'}
        next_cursor: {type: string, description: Absent on the last page.}
    TenantModel:
      type: object
      additionalProperties: false
      required: [model, allowed]
      properties:
        model: {$ref: '#/components/schemas/Model'}
        allowed: {type: boolean, description: false when the tenant's restriction leaves the model out.}
        price: {$ref: '#/components/schemas/PriceVersion', description: The catalogue's version in force.}
        tenant_price: {$ref: '#/components/schemas/TenantPriceVersion'}
        price_source: {type: string, description: 'tenant or catalogue: which of tenant_price and price applies to the tenant in its active currency; empty when neither does.'}
    TenantModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TenantModel'}
        next_cursor: {type: string, description: Absent on the last page.}
    ModelRestriction:
      type: object
      additionalProperties: false
      required: [restricted, models]
      properties:
        restricted: {type: boolean, description: false when the tenant has no restriction.}
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelRef'}
        updated_at: {type: string, format: date-time}
    ModelRestrictionSet:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          maxItems: 512
          uniqueItems: true
          items: {$ref: '#/components/schemas/ModelRef'}
    ID:
      type: string
      description: A UUID in canonical lower-case form.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Name:
      type: string
      description: Lower-case letters, digits and hyphens; 1 to 63 characters; no hyphen at either end.
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    VirtualKeyID:
      type: string
      pattern: '^t[a-z2-7]{16}$'
    PlatformKeyID:
      type: string
      pattern: '^p[a-z2-7]{16}$'
    ProviderName:
      type: string
      description: Identifier of a provider of the catalogue.
      pattern: '^[a-z][a-z0-9-]{0,62}$'
    CredentialState:
      type: string
      description: active, disabled (can be enabled again) or revoked (final; the sealed secret is destroyed).
      enum: [active, disabled, revoked]
    CredentialOwner:
      type: string
      description: Who owns the credential and pays the provider. Credentials of the platform come with a later version.
      enum: [tenant]
    CredentialActor:
      type: string
      description: Which side last changed the state of the credential.
      enum: [tenant, platform]
    Credential:
      type: object
      additionalProperties: false
      required: [id, tenant_id, provider, label, description, owner, state, is_default, fingerprint, hint, state_changed_at, state_changed_by, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        tenant_id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        label: {$ref: '#/components/schemas/Name'}
        description: {type: string}
        owner: {$ref: '#/components/schemas/CredentialOwner'}
        state: {$ref: '#/components/schemas/CredentialState'}
        is_default: {type: boolean, description: Whether calls for the provider use this credential when the key is not pinned to another.}
        fingerprint: {type: string, description: 'Keyed hash of the secret, 32 hexadecimal characters. Equal secrets of one tenant have equal fingerprints; it cannot be computed outside Pandokos.'}
        hint: {type: string, description: 'The last four characters of the secret; empty when the secret is shorter than 16 characters.'}
        expires_at: {type: string, format: date-time, description: Expiry as declared by the tenant. Informative.}
        validated_at: {type: string, format: date-time, description: When the provider last accepted the current secret.}
        rotated_at: {type: string, format: date-time, description: When the secret was last replaced.}
        state_changed_at: {type: string, format: date-time}
        state_changed_by: {$ref: '#/components/schemas/CredentialActor'}
        state_reason: {type: string, description: The reason given with the last change of state.}
        created_at: {type: string, format: date-time}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [provider, label, secret]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        label: {$ref: '#/components/schemas/Name'}
        secret: {type: string, minLength: 8, maxLength: 8192, description: 'The provider API key. Write-only: no operation returns it.'}
        description: {type: string, maxLength: 500}
        expires_at: {type: string, format: date-time}
        validate: {type: boolean, description: Present the secret to the provider before storing it.}
    CredentialUpdate:
      type: object
      additionalProperties: false
      properties:
        label: {$ref: '#/components/schemas/Name'}
        description: {type: string, maxLength: 500}
        expires_at: {type: [string, "null"], format: date-time}
    CredentialSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: {type: string, minLength: 8, maxLength: 8192, description: 'The new provider API key. Write-only.'}
        expires_at: {type: string, format: date-time}
        validate: {type: boolean, description: Present the secret to the provider before storing it.}
    CredentialList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Credential'}
        next_cursor: {type: string, description: Absent on the last page.}
    RequiredReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: Recorded in the audit log.}
    Sort:
      type: string
      enum: [created_at, -created_at]
      default: created_at
    NamedSort:
      type: string
      enum: [created_at, -created_at, name, -name]
      default: created_at
    TenantState:
      type: string
      enum: [provisioning, active, suspended, deleting, deleted]
    ServiceAccountState:
      type: string
      enum: [active, disabled]
    KeyState:
      type: string
      description: active, expired (expires_at has passed) or revoked. A revoked key is revoked whatever its expiry.
      enum: [active, expired, revoked]
    PrincipalType:
      type: string
      enum: [platform, service_account, user]
    ProblemCode:
      type: string
      description: Stable machine-readable code. Clients must tolerate codes added later.
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - tenant_suspended
        - not_found
        - conflict
        - invalid_state
        - request_too_large
        - unsupported_media_type
        - internal
        - unavailable
        - credential_rejected
        - validation_unavailable
        - price_source_unavailable
        - price_dataset_invalid
        - too_many_attempts
        - password_change_required
        - csrf_rejected
        - sign_in_disabled
        - idempotency_key_reused
        - idempotency_in_progress
        - idempotency_response_lost
        - escalation_refused
        - support_disabled
        - role_in_use
    Problem:
      type: object
      description: RFC 9457 problem details with the members code, request_id and errors.
      additionalProperties: false
      required: [type, title, status, code, detail, request_id]
      properties:
        type: {type: string, description: 'urn:pandokos:problem:<code>'}
        title: {type: string}
        status: {type: integer}
        code: {$ref: '#/components/schemas/ProblemCode'}
        detail: {type: string, description: A fixed sentence for the code. It never holds data of the request or of the system.}
        request_id: {type: string}
        errors:
          type: array
          description: Present with invalid_request when single members are at fault.
          items: {$ref: '#/components/schemas/FieldError'}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string, description: 'Name of the body member or of the parameter.'}
        message: {type: string, description: 'The rule that was broken. It never repeats the value.'}
    SignInMethod: {type: string, enum: [local, oidc]}
    UserState: {type: string, enum: [active, disabled]}
    RoleSource: {type: string, enum: [manual, idp]}
    ManagedBy: {type: string, enum: [tenant, platform]}
    MemberAccountKind: {type: string, enum: [new, existing]}
    UserSort:
      type: string
      enum: [created_at, -created_at, username, -username]
      default: created_at
    Username: {type: string, pattern: '^[a-z0-9][a-z0-9._@+-]{1,62}[a-z0-9]$'}
    DisplayName: {type: string, maxLength: 200}
    Email: {type: string, maxLength: 254}
    RoleName: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    LocalAuthMethod:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    OidcAuthMethod:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        display_name: {type: string}
        start_path: {type: string, description: 'Navigate the browser here: /v1/auth/oidc/start.'}
    AuthMethods:
      type: object
      additionalProperties: false
      required: [local, oidc]
      properties:
        local: {$ref: '#/components/schemas/LocalAuthMethod'}
        oidc: {$ref: '#/components/schemas/OidcAuthMethod'}
    SignInRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64, description: Compared without regard to case.}
        password: {type: string, minLength: 1, maxLength: 1024}
    PasswordChange:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024}
        new_password: {type: string, minLength: 1, maxLength: 1024}
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, sign_in, display_name]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        sign_in: {$ref: '#/components/schemas/SignInMethod'}
        username: {$ref: '#/components/schemas/Username'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
    Session:
      type: object
      additionalProperties: false
      required: [id, user, method, must_change_password, current, created_at, last_used_at, expires_at, idle_timeout_seconds]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        user: {$ref: '#/components/schemas/SessionUser'}
        method: {$ref: '#/components/schemas/SignInMethod'}
        must_change_password: {type: boolean}
        current: {type: boolean, description: True for the session of the request.}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        idle_timeout_seconds: {type: integer}
    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Session'}}
    SignedOut:
      type: object
      additionalProperties: false
      required: [signed_out]
      properties:
        signed_out: {type: boolean}
    SessionsRevoked:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked: {type: integer}
    User:
      type: object
      additionalProperties: false
      required: [id, sign_in, display_name, email, state, state_changed_at, platform_roles, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        sign_in: {$ref: '#/components/schemas/SignInMethod'}
        username: {$ref: '#/components/schemas/Username'}
        subject: {type: string, description: Subject at the identity provider; federated users only.}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        email: {$ref: '#/components/schemas/Email'}
        state: {$ref: '#/components/schemas/UserState'}
        state_changed_at: {type: string, format: date-time}
        must_change_password: {type: boolean}
        locked_until: {type: string, format: date-time, description: Present while sign-in is locked.}
        platform_roles: {type: array, items: {$ref: '#/components/schemas/RoleName'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UserCreate:
      type: object
      additionalProperties: false
      required: [sign_in]
      properties:
        sign_in: {$ref: '#/components/schemas/SignInMethod'}
        username: {$ref: '#/components/schemas/Username'}
        subject: {type: string, minLength: 1, maxLength: 255}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        email: {$ref: '#/components/schemas/Email'}
        platform_roles: {type: array, maxItems: 8, uniqueItems: true, items: {$ref: '#/components/schemas/RoleName'}}
    UserCreated:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/User'}
        initial_password: {type: string, description: 'Shown once, for a local account; absent on an idempotent replay.'}
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: {$ref: '#/components/schemas/DisplayName'}
        email: {$ref: '#/components/schemas/Email'}
