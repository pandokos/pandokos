      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EndpointCreate'}}}}
      responses:
        "201": {$ref: '#/components/responses/EndpointCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/providers/{provider}/endpoints/{endpoint}:
    parameters:
      - {$ref: '#/components/parameters/Provider'}
      - {$ref: '#/components/parameters/Endpoint'}
    get:
      operationId: getEndpoint
      tags: [catalog]
      summary: Read an endpoint
      x-pandokos-permission: catalog:read
      responses:
        "200": {$ref: '#/components/responses/Endpoint'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateEndpoint
      tags: [catalog]
      summary: Change an endpoint or make it the default
      x-pandokos-permission: catalog:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EndpointUpdate'}}}}
      responses:
        "200": {$ref: '#/components/responses/Endpoint'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteEndpoint
      tags: [catalog]
      summary: Delete an endpoint
      description: >-
        Refused with invalid_state for the default endpoint while the provider has another endpoint. The response is the endpoint as it was.
      x-pandokos-permission: catalog:write
      responses:
        "200": {$ref: '#/components/responses/Endpoint'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models:
    get:
      operationId: listModels
      tags: [catalog]
      summary: List the models of the catalogue
      x-pandokos-permission: catalog:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Sort'}
        - {name: provider, in: query, description: Only models of this provider., schema: {$ref: '#/components/schemas/ProviderName'}}
        - {name: name, in: query, description: Only the model with this public name., schema: {$ref: '#/components/schemas/ModelName'}}
        - {name: status, in: query, description: Only models with this status., schema: {$ref: '#/components/schemas/ModelStatus'}}
        - {name: availability, in: query, description: Only models with this availability., schema: {$ref: '#/components/schemas/ModelAvailability'}}
      responses:
        "200": {$ref: '#/components/responses/ModelList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createModel
      tags: [catalog]
      summary: Add a model
      description: >-
        availability defaults to selected: nobody may use the model until it is granted or made available to all. upstream_id defaults to the name.
      x-pandokos-permission: catalog:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelCreate'}}}}
      responses:
        "201": {$ref: '#/components/responses/ModelCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}:
    parameters:
      - {$ref: '#/components/parameters/Model'}
    get:
      operationId: getModel
      tags: [catalog]
      summary: Read a model
      x-pandokos-permission: catalog:read
      responses:
        "200": {$ref: '#/components/responses/Model'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateModel
      tags: [catalog]
      summary: Change a model
      x-pandokos-permission: catalog:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelUpdate'}}}}
      responses:
        "200": {$ref: '#/components/responses/Model'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteModel
      tags: [catalog]
      summary: Delete a model that has no price
      description: >-
        Refused with invalid_state once a price version exists: retire the model instead. Grants are removed with it. The response is the model as it was.
      x-pandokos-permission: catalog:write
      responses:
        "200": {$ref: '#/components/responses/Model'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/grants:
    parameters:
      - {$ref: '#/components/parameters/Model'}
    get:
      operationId: listModelGrants
      tags: [catalog]
      summary: List the tenants a model is granted to
      x-pandokos-permission: catalog:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200": {$ref: '#/components/responses/ModelGrantList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/grants/{tenant}:
    parameters:
      - {$ref: '#/components/parameters/Model'}
      - {$ref: '#/components/parameters/Tenant'}
    put:
      operationId: grantModel
      tags: [catalog]
      summary: Grant a model to a tenant
      description: >-
        Idempotent. The grant matters while the availability of the model is selected.
      x-pandokos-permission: catalog:write
      responses:
        "200": {$ref: '#/components/responses/ModelGrant'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: revokeModelGrant
      tags: [catalog]
      summary: Revoke the grant of a model to a tenant
      description: >-
        The response is the grant as it was; not_found when there is none.
      x-pandokos-permission: catalog:write
      responses:
        "200": {$ref: '#/components/responses/ModelGrant'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/prices:
    parameters:
      - {$ref: '#/components/parameters/Model'}
    get:
      operationId: listPriceVersions
      tags: [prices]
      summary: List the price versions of a model, newest first
      x-pandokos-permission: catalog:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: at, in: query, description: 'An RFC 3339 time: only the version in force then (at most one item).', schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        "200": {$ref: '#/components/responses/PriceVersionList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createPriceOverride
      tags: [prices]
      summary: Set an operator price for a model
      description: >-
        Adds a version with source override that starts at valid_from (now when absent; never in the past). From then on imports leave the model alone until clearPriceOverride.
      x-pandokos-permission: catalog:price
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceOverride'}}}}
      responses:
        "201": {$ref: '#/components/responses/PriceVersionCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/prices/{price_version}:
    parameters:
      - {$ref: '#/components/parameters/Model'}
      - {$ref: '#/components/parameters/PriceVersion'}
    delete:
      operationId: deletePriceVersion
      tags: [prices]
      summary: Remove a price version that has not started
      description: >-
        Refused with invalid_state once the version is in force or past: versions are immutable. The response is the version as it was.
      x-pandokos-permission: catalog:price
      responses:
        "200": {$ref: '#/components/responses/PriceVersion'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/clear-price-override:
    parameters:
      - {$ref: '#/components/parameters/Model'}
    post:
      operationId: clearPriceOverride
      tags: [prices]
      summary: Let imports price the model again
      description: >-
        Refused with invalid_state while a version of the model has not started. The override in force stays in force until an import creates a version.
      x-pandokos-permission: catalog:price
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/Reason'}}}}
      responses:
        "200": {$ref: '#/components/responses/Model'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/price-imports:
    get:
      operationId: listPriceImports
      tags: [prices]
      summary: List price imports, newest first
      x-pandokos-permission: catalog:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200": {$ref: '#/components/responses/PriceImportList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: runPriceImport
      tags: [prices]
      summary: Import prices now
      description: >-
        embedded imports the snapshot of this release; remote downloads pricing.refresh.url and is refused unless pricing.refresh.enabled. With dry_run nothing is written and the response has no id.
      x-pandokos-permission: catalog:price
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceImportRun'}}}}
      responses:
        "201": {$ref: '#/components/responses/PriceImportCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/PriceDatasetInvalid'}
        "500": {$ref: '#/components/responses/Internal'}
        "502": {$ref: '#/components/responses/PriceSourceUnavailable'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/price-imports/{price_import}:
    parameters:
      - {$ref: '#/components/parameters/PriceImport'}
    get:
      operationId: getPriceImport
      tags: [prices]
      summary: Read a price import with its report
      x-pandokos-permission: catalog:read
      responses:
        "200": {$ref: '#/components/responses/PriceImport'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/models:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listTenantModels
      tags: [model-access]
      summary: List the models available to the tenant
      description: >-
        Models the platform made available to the tenant, with allowed false for those outside the tenant's restriction, and the price in force now.
      x-pandokos-permission: model:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: provider, in: query, description: Only models of this provider., schema: {$ref: '#/components/schemas/ProviderName'}}
      responses:
        "200": {$ref: '#/components/responses/TenantModelList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/model-restriction:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: getModelRestriction
      tags: [model-access]
      summary: Read the model restriction of the tenant
      x-pandokos-permission: model:read
      responses:
        "200": {$ref: '#/components/responses/ModelRestriction'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: setModelRestriction
      tags: [model-access]
      summary: Restrict the tenant to the models named
      description: >-
        Every reference must name a model available to the tenant. An empty list allows no model.
      x-pandokos-permission: model:restrict
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRestrictionSet'}}}}
      responses:
        "200": {$ref: '#/components/responses/ModelRestriction'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: clearModelRestriction
      tags: [model-access]
      summary: Remove the model restriction of the tenant
      x-pandokos-permission: model:restrict
      responses:
        "200": {$ref: '#/components/responses/ModelRestriction'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/platform-keys:
    get:
      operationId: listPlatformKeys
      tags: [platform-keys]
      summary: List platform keys
      x-pandokos-permission: platform_key:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Sort'}
        - name: state
          in: query
          description: Only keys in this state.
          schema: {$ref: '#/components/schemas/KeyState'}
      responses:
        "200": {$ref: '#/components/responses/PlatformKeyList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createPlatformKey
      tags: [platform-keys]
      summary: Issue a platform key with the role platform-admin
      description: The key is returned once and is stored only as a hash.
      x-pandokos-permission: platform_key:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformKeyCreate'}
      responses:
        "201": {$ref: '#/components/responses/PlatformKeyCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/platform-keys/{key}:
    parameters:
      - {$ref: '#/components/parameters/PlatformKey'}
    get:
      operationId: getPlatformKey
      tags: [platform-keys]
      summary: Read the metadata of a platform key
      x-pandokos-permission: platform_key:read
      responses:
        "200": {$ref: '#/components/responses/PlatformKey'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/platform-keys/{key}/revoke:
    parameters:
      - {$ref: '#/components/parameters/PlatformKey'}
    post:
      operationId: revokePlatformKey
      tags: [platform-keys]
      summary: Revoke a platform key
      description: A revocation cannot be undone. Revoking a revoked key succeeds and changes nothing.
      x-pandokos-permission: platform_key:revoke
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/PlatformKey'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    key:
      type: http
      scheme: bearer
      description: A virtual key or a platform key (pdk_…).
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Tenant ID.
      schema: {$ref: '#/components/schemas/ID'}
    ServiceAccount:
      name: service_account
      in: path
      required: true
      description: Service account ID.
      schema: {$ref: '#/components/schemas/ID'}
    VirtualKey:
      name: key
      in: path
      required: true
      description: Key ID of a virtual key (the public part of the key).
      schema: {$ref: '#/components/schemas/VirtualKeyID'}
    PlatformKey:
      name: key
      in: path
      required: true
      description: Key ID of a platform key (the public part of the key).
      schema: {$ref: '#/components/schemas/PlatformKeyID'}
    Credential:
      name: credential
      in: path
      required: true
      description: Credential ID.
      schema: {$ref: '#/components/schemas/ID'}
    Provider:
      name: provider
      in: path
      required: true
      description: Name of a provider.
      schema: {$ref: '#/components/schemas/ProviderName'}
    Endpoint:
      name: endpoint
      in: path
      required: true
      description: Name of an endpoint of the provider.
      schema: {$ref: '#/components/schemas/Name'}
    Model:
      name: model
      in: path
      required: true
      description: Model ID.
      schema: {$ref: '#/components/schemas/ID'}
    PriceVersion:
      name: price_version
      in: path
      required: true
      description: Price version ID.
      schema: {$ref: '#/components/schemas/ID'}
    PriceImport:
      name: price_import
      in: path
      required: true
      description: Price import ID.
      schema: {$ref: '#/components/schemas/ID'}
    Limit:
      name: limit
      in: query
      description: Maximum number of items in the page.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page. It is valid only with the same sort and filters.
      schema: {type: string, minLength: 1, maxLength: 512}
    Sort:
      name: sort
      in: query
      description: Order of the items. A leading minus means descending.
      schema: {$ref: '#/components/schemas/Sort'}
    NamedSort:
      name: sort
      in: query
      description: Order of the items. A leading minus means descending.
      schema: {$ref: '#/components/schemas/NamedSort'}
  responses:
    Me:
      description: The caller.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Me'}
    Tenant:
      description: The tenant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Tenant'}
    TenantCreated:
      description: The tenant, its first service account and that account's key.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TenantCreated'}
    TenantList:
      description: One page of tenants.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TenantList'}
    ServiceAccount:
      description: The service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    ServiceAccountCreated:
      description: The new service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    ServiceAccountList:
      description: One page of service accounts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccountList'}
    VirtualKey:
      description: The metadata of the key. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VirtualKey'}
    VirtualKeyCreated:
      description: The new key and, this once, its secret.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VirtualKeyCreated'}
    VirtualKeyList:
      description: One page of virtual keys.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VirtualKeyList'}
    PlatformKey:
      description: The metadata of the key. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformKey'}
    PlatformKeyCreated:
      description: The new key and, this once, its secret.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformKeyCreated'}
    PlatformKeyList:
      description: One page of platform keys.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformKeyList'}
    Credential:
      description: The metadata of the credential. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Credential'}
    CredentialCreated:
      description: The metadata of the new credential. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Credential'}
    CredentialList:
      description: One page of credentials (metadata).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CredentialList'}
    CredentialRejected:
      description: 'The provider refused the secret; nothing was stored. Code: credential_rejected.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationUnavailable:
      description: 'The provider could not be asked or gave no clear answer; nothing was stored. Code: validation_unavailable.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InvalidRequest:
      description: 'The request is malformed or breaks a rule of this document. Code: invalid_request.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: 'The credential is missing, malformed, unknown, expired or revoked. Code: unauthenticated.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: 'The caller lacks the permission (code forbidden) or its tenant is not active (code tenant_suspended).'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: 'The resource does not exist or belongs to another tenant; the two cases are identical. Code: not_found.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: 'The name is taken (code conflict) or the resource is in a state that does not allow the operation (code invalid_state).'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RequestTooLarge:
      description: 'The body is larger than 1048576 bytes. Code: request_too_large.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: 'The body is not application/json. Code: unsupported_media_type.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Internal:
      description: 'Unexpected failure. Code: internal.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: 'Pandokos cannot verify or record the request right now. Code: unavailable.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

    Provider:
      description: The provider.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Provider'}
    ProviderCreated:
      description: The new provider.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Provider'}
    ProviderList:
      description: One page of providers.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProviderList'}
    Endpoint:
      description: The endpoint.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Endpoint'}
    EndpointCreated:
      description: The new endpoint.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Endpoint'}
    EndpointList:
      description: One page of endpoints.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EndpointList'}
    Model:
      description: The model.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Model'}
    ModelCreated:
      description: The new model.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Model'}
    ModelList:
      description: One page of models.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelList'}
    ModelGrant:
      description: The grant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelGrant'}
    ModelGrantList:
      description: One page of grants.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelGrantList'}
    PriceVersion:
      description: The price version.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceVersion'}
    PriceVersionCreated:
      description: The new price version.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceVersion'}
    PriceVersionList:
      description: One page of price versions.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceVersionList'}
    PriceImport:
      description: The import, with its report.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceImport'}
    PriceImportCreated:
      description: The import that ran, with its report.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceImport'}
    PriceImportList:
      description: One page of imports (without reports).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PriceImportList'}
    TenantModelList:
      description: One page of the models available to the tenant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TenantModelList'}
    ModelRestriction:
      description: The model restriction of the tenant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelRestriction'}
    PriceSourceUnavailable:
      description: 'The price dataset could not be downloaded; nothing was imported. Code: price_source_unavailable.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PriceDatasetInvalid:
      description: 'The price dataset could not be read; nothing was imported. Code: price_dataset_invalid.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    ApiFamily:
      type: string
      description: The wire protocol of a provider.
      enum: [openai, anthropic]
    ModelName:
      type: string
      description: 'The public name callers send: letters, digits and . _ : @ / + -, 1 to 128 characters.'
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/+-]{0,127}$'
    ModelRef:
      type: string
      description: A model named as provider/name.
      pattern: '^[a-z][a-z0-9-]{0,62}/[A-Za-z0-9][A-Za-z0-9._:@/+-]{0,127}$'
    ModelStatus:
      type: string
      description: active; deprecated (still callable, flagged); retired (callable by nobody).
      enum: [active, deprecated, retired]
    ModelAvailability:
      type: string
      description: all tenants, or the tenants the model is granted to.
      enum: [all, selected]
    PriceSource:
      type: string
      enum: [import, override]
    PriceCategory:
      type: string
      description: The units a rate applies to.
      enum: [input, output, cache_read, cache_write, cache_write_1h, input_audio, output_audio]
    PriceImportSource:
      type: string
      enum: [embedded, file, remote]
    PriceImportRunSource:
      type: string
      enum: [embedded, remote]
    Provider:
      type: object
      additionalProperties: false
      required: [id, name, display_name, description, api_family, enabled, dataset_provider, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {$ref: '#/components/schemas/ProviderName'}
        display_name: {type: string}
        description: {type: string}
        api_family: {$ref: '#/components/schemas/ApiFamily'}
        enabled: {type: boolean}
        dataset_provider: {type: string, description: Identifier of the provider in the price dataset; empty when its prices are not imported.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProviderCreate:
      type: object
      additionalProperties: false
      required: [name, api_family]
      properties:
        name: {$ref: '#/components/schemas/ProviderName'}
        api_family: {$ref: '#/components/schemas/ApiFamily'}
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 500}
        dataset_provider: {type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'}
    ProviderUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 500}
        enabled: {type: boolean}
        dataset_provider: {type: string, pattern: '^([a-z0-9][a-z0-9_.-]{0,62})?$', description: Empty stops imports for the provider.}
    ProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Provider'}
        next_cursor: {type: string, description: Absent on the last page.}
    Endpoint:
      type: object
      additionalProperties: false
      required: [id, provider, name, base_url, region, private, enabled, is_default, description, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        name: {$ref: '#/components/schemas/Name'}
        base_url: {type: string, description: The native path of a request is appended to it.}
        region: {type: string}
        private: {type: boolean, description: Declared by the platform administrator to be on a private network.}
        enabled: {type: boolean}
        is_default: {type: boolean, description: The endpoint the gateway uses for the provider.}
        description: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EndpointCreate:
      type: object
      additionalProperties: false
      required: [name, base_url]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        base_url: {type: string, minLength: 8, maxLength: 2048, pattern: '^https?://[^/?#@\s]+(/[^?#\s]*)?$'}
        region: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
        private: {type: boolean}
        is_default: {type: boolean}
        description: {type: string, maxLength: 500}
    EndpointUpdate:
      type: object
      additionalProperties: false
      properties:
        base_url: {type: string, minLength: 8, maxLength: 2048, pattern: '^https?://[^/?#@\s]+(/[^?#\s]*)?$'}
        region: {type: string, pattern: '^([a-z0-9][a-z0-9-]{0,62})?$'}
        private: {type: boolean}
        enabled: {type: boolean}
        is_default: {type: boolean, description: true makes this the default; false is refused for the default (make another one the default instead).}
        description: {type: string, maxLength: 500}
    EndpointList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Endpoint'}
        next_cursor: {type: string, description: Absent on the last page.}
    Model:
      type: object
      additionalProperties: false
      required: [id, provider, api_family, name, ref, upstream_id, display_name, description, status, availability, capabilities, context_window, max_output_tokens, price_override, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        api_family: {$ref: '#/components/schemas/ApiFamily'}
        name: {$ref: '#/components/schemas/ModelName'}
        ref: {$ref: '#/components/schemas/ModelRef'}
        upstream_id: {type: string, description: The identifier the provider receives.}
        display_name: {type: string}
        description: {type: string}
        status: {$ref: '#/components/schemas/ModelStatus'}
        availability: {$ref: '#/components/schemas/ModelAvailability'}
        capabilities:
          type: array
          items: {type: string}
        context_window: {type: integer, description: In tokens; 0 when not known.}
        max_output_tokens: {type: integer, description: In tokens; 0 when not known.}
        price_override: {type: boolean, description: An operator price is in place and imports leave the model alone.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ModelCreate:
      type: object
      additionalProperties: false
      required: [provider, name]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        name: {$ref: '#/components/schemas/ModelName'}
        upstream_id: {type: string, maxLength: 256, pattern: '^[!-~]+$'}
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
        status: {$ref: '#/components/schemas/ModelStatus'}
        availability: {$ref: '#/components/schemas/ModelAvailability'}
        capabilities:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, pattern: '^(text|vision|audio|tools|reasoning|embeddings|structured_output|streaming)$'}
        context_window: {type: integer, minimum: 0, maximum: 100000000}
        max_output_tokens: {type: integer, minimum: 0, maximum: 100000000}
    ModelUpdate:
      type: object
      additionalProperties: false
      properties:
        upstream_id: {type: string, maxLength: 256, pattern: '^[!-~]+$'}
        display_name: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
        status: {$ref: '#/components/schemas/ModelStatus'}
        availability: {$ref: '#/components/schemas/ModelAvailability'}
        capabilities:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, pattern: '^(text|vision|audio|tools|reasoning|embeddings|structured_output|streaming)$'}
        context_window: {type: integer, minimum: 0, maximum: 100000000, description: 0 clears it.}
        max_output_tokens: {type: integer, minimum: 0, maximum: 100000000, description: 0 clears it.}
    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Model'}
        next_cursor: {type: string, description: Absent on the last page.}
    ModelGrant:
      type: object
      additionalProperties: false
      required: [model_id, tenant_id, tenant_name, created_at]
      properties:
        model_id: {$ref: '#/components/schemas/ID'}
        tenant_id: {$ref: '#/components/schemas/ID'}
        tenant_name: {$ref: '#/components/schemas/Name'}
        created_at: {type: string, format: date-time}
    ModelGrantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ModelGrant'}
        next_cursor: {type: string, description: Absent on the last page.}
    PriceRate:
      type: object
      additionalProperties: false
      required: [category, threshold, rate]
      properties:
        category: {$ref: '#/components/schemas/PriceCategory'}
        threshold: {type: integer, minimum: 0, maximum: 100000000, description: 'Input tokens of a request from which this rate applies to every unit of the category; 0 for the base rate.'}
        rate: {type: string, pattern: '^(0|[1-9][0-9]{0,6})(\.[0-9]{1,12})?$', description: 'Price per million units, as a decimal string, in the currency of the version.'}
    PriceVersion:
      type: object
      additionalProperties: false
      required: [id, model_id, valid_from, currency, source, note, rates, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        model_id: {$ref: '#/components/schemas/ID'}
        valid_from: {type: string, format: date-time}
        currency: {type: string, description: ISO 4217 code.}
        source: {$ref: '#/components/schemas/PriceSource'}
        import_id: {$ref: '#/components/schemas/ID'}
        note: {type: string}
        rates:
          type: array
          items: {$ref: '#/components/schemas/PriceRate'}
        created_at: {type: string, format: date-time}
    PriceVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PriceVersion'}
        next_cursor: {type: string, description: Absent on the last page.}
    PriceOverride:
      type: object
      additionalProperties: false
      required: [currency, rates]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        valid_from: {type: string, format: date-time, description: Now when absent; never in the past.}
        note: {type: string, maxLength: 500}
        rates:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/PriceRate'}
    PriceImportIssue:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string}
        detail: {type: string}
    PriceImportItem:
      type: object
      additionalProperties: false
      required: [provider, model, outcome]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        model: {$ref: '#/components/schemas/ModelName'}
        dataset_model: {type: string}
        outcome: {type: string, description: 'created, unchanged, overridden, unmatched or skipped.'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/PriceImportIssue'}
    PriceImport:
      type: object
      additionalProperties: false
      required: [source, dataset_format, outcome, models_seen, versions_created, unchanged, overridden, unmatched, skipped, started_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        source: {$ref: '#/components/schemas/PriceImportSource'}
        source_ref: {type: string}
        dataset_format: {type: string}
        digest: {type: string, description: SHA-256 of the dataset, hexadecimal.}
        outcome: {type: string, description: success or failure.}
        error_class: {type: string}
        actor_type: {type: string}
        models_seen: {type: integer}
        versions_created: {type: integer}
        unchanged: {type: integer}
        overridden: {type: integer}
        unmatched: {type: integer}
        skipped: {type: integer}
        dry_run: {type: boolean}
        items:
          type: array
          description: The report; absent in lists.
          items: {$ref: '#/components/schemas/PriceImportItem'}
        truncated: {type: integer, description: Report items left out because the report reached its size limit.}
        started_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    PriceImportRun:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: {$ref: '#/components/schemas/PriceImportRunSource'}
        dry_run: {type: boolean}
    PriceImportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PriceImport'}
        next_cursor: {type: string, description: Absent on the last page.}
    TenantModel:
      type: object
      additionalProperties: false
      required: [model, allowed]
      properties:
        model: {$ref: '#/components/schemas/Model'}
        allowed: {type: boolean, description: false when the tenant's restriction leaves the model out.}
        price: {$ref: '#/components/schemas/PriceVersion'}
    TenantModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TenantModel'}
        next_cursor: {type: string, description: Absent on the last page.}
    ModelRestriction:
      type: object
      additionalProperties: false
      required: [restricted, models]
      properties:
        restricted: {type: boolean, description: false when the tenant has no restriction.}
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelRef'}
        updated_at: {type: string, format: date-time}
    ModelRestrictionSet:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          maxItems: 512
          uniqueItems: true
          items: {$ref: '#/components/schemas/ModelRef'}
    ID:
      type: string
      description: A UUID in canonical lower-case form.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Name:
      type: string
      description: Lower-case letters, digits and hyphens; 1 to 63 characters; no hyphen at either end.
      pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    VirtualKeyID:
      type: string
      pattern: '^t[a-z2-7]{16}$'
    PlatformKeyID:
      type: string
      pattern: '^p[a-z2-7]{16}$'
    ProviderName:
      type: string
      description: Identifier of a provider. This version accepts openai and anthropic.
      pattern: '^[a-z][a-z0-9-]{0,62}$'
    CredentialState:
      type: string
      description: active, disabled (can be enabled again) or revoked (final; the sealed secret is destroyed).
      enum: [active, disabled, revoked]
    CredentialOwner:
      type: string
      description: Who owns the credential and pays the provider. Credentials of the platform come with a later version.
      enum: [tenant]
    CredentialActor:
      type: string
      description: Which side last changed the state of the credential.
      enum: [tenant, platform]
    Credential:
      type: object
      additionalProperties: false
      required: [id, tenant_id, provider, label, description, owner, state, is_default, fingerprint, hint, state_changed_at, state_changed_by, created_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        tenant_id: {$ref: '#/components/schemas/ID'}
        provider: {$ref: '#/components/schemas/ProviderName'}
        label: {$ref: '#/components/schemas/Name'}
        description: {type: string}
        owner: {$ref: '#/components/schemas/CredentialOwner'}
        state: {$ref: '#/components/schemas/CredentialState'}
        is_default: {type: boolean, description: Whether calls for the provider use this credential when the key is not pinned to another.}
        fingerprint: {type: string, description: 'Keyed hash of the secret, 32 hexadecimal characters. Equal secrets of one tenant have equal fingerprints; it cannot be computed outside Pandokos.'}
        hint: {type: string, description: 'The last four characters of the secret; empty when the secret is shorter than 16 characters.'}
        expires_at: {type: string, format: date-time, description: Expiry as declared by the tenant. Informative.}
        validated_at: {type: string, format: date-time, description: When the provider last accepted the current secret.}
        rotated_at: {type: string, format: date-time, description: When the secret was last replaced.}
        state_changed_at: {type: string, format: date-time}
        state_changed_by: {$ref: '#/components/schemas/CredentialActor'}
        state_reason: {type: string, description: The reason given with the last change of state.}
        created_at: {type: string, format: date-time}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [provider, label, secret]
      properties:
        provider: {$ref: '#/components/schemas/ProviderName'}
        label: {$ref: '#/components/schemas/Name'}
        secret: {type: string, minLength: 8, maxLength: 8192, description: 'The provider API key. Write-only: no operation returns it.'}
        description: {type: string, maxLength: 500}
        expires_at: {type: string, format: date-time}
        validate: {type: boolean, description: Present the secret to the provider before storing it.}
    CredentialUpdate:
      type: object
      additionalProperties: false
      properties:
        label: {$ref: '#/components/schemas/Name'}
        description: {type: string, maxLength: 500}
        expires_at: {type: [string, "null"], format: date-time}
    CredentialSecret:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: {type: string, minLength: 8, maxLength: 8192, description: 'The new provider API key. Write-only.'}
        expires_at: {type: string, format: date-time}
        validate: {type: boolean, description: Present the secret to the provider before storing it.}
    CredentialList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Credential'}
        next_cursor: {type: string, description: Absent on the last page.}
    RequiredReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500, description: Recorded in the audit log of the tenant and on the credential.}
    Sort:
      type: string
      enum: [created_at, -created_at]
      default: created_at
    NamedSort:
      type: string
      enum: [created_at, -created_at, name, -name]
      default: created_at
    TenantState:
      type: string
      enum: [provisioning, active, suspended, deleting, deleted]
    ServiceAccountState:
      type: string
      enum: [active, disabled]
    KeyState:
      type: string
      description: active, expired (expires_at has passed) or revoked. A revoked key is revoked whatever its expiry.
      enum: [active, expired, revoked]
    PrincipalType:
      type: string
      enum: [platform, service_account]
    ProblemCode:
      type: string
      description: Stable machine-readable code. Clients must tolerate codes added later.
      enum:
        - invalid_request
        - unauthenticated
        - forbidden
        - tenant_suspended
        - not_found
        - conflict
        - invalid_state
        - request_too_large
        - unsupported_media_type
        - internal
        - unavailable
        - credential_rejected
        - validation_unavailable
        - price_source_unavailable
        - price_dataset_invalid
    Problem:
      type: object
      description: RFC 9457 problem details with the members code, request_id and errors.
      additionalProperties: false
      required: [type, title, status, code, detail, request_id]
      properties:
        type: {type: string, description: 'urn:pandokos:problem:<code>'}
        title: {type: string}
        status: {type: integer}
        code: {$ref: '#/components/schemas/ProblemCode'}
        detail: {type: string, description: A fixed sentence for the code. It never holds data of the request or of the system.}
        request_id: {type: string}
        errors:
          type: array
          description: Present with invalid_request when single members are at fault.
          items: {$ref: '#/components/schemas/FieldError'}
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: {type: string, description: 'Name of the body member or of the parameter.'}
        message: {type: string, description: 'The rule that was broken. It never repeats the value.'}
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 500, description: Recorded in the audit log.}
    TenantRef:
      type: object
      additionalProperties: false
      required: [id, name, state]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {$ref: '#/components/schemas/Name'}
        state: {$ref: '#/components/schemas/TenantState'}
    Me:
      type: object
      additionalProperties: false
      required: [principal_type, id, name, key_id, bootstrap, roles, permissions]
      properties:
        principal_type: {$ref: '#/components/schemas/PrincipalType'}
        id: {type: string, description: Service account ID, or the key ID of the platform key.}
        name: {type: string}
        key_id: {type: string, description: Key ID of the credential in use.}
        bootstrap: {type: boolean, description: True when the credential is the bootstrap key created by pandokos init.}
        tenant: {$ref: '#/components/schemas/TenantRef'}
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          description: Effective permissions, after the scopes of the key are applied.
          items: {type: string}
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, display_name, state, created_at, updated_at, state_changed_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        name: {$ref: '#/components/schemas/Name'}
        display_name: {type: string}
        state: {$ref: '#/components/schemas/TenantState'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        state_changed_at: {type: string, format: date-time}
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        display_name: {type: string, maxLength: 200}
        admin_service_account_name:
          description: Name of the first service account. Default admin.
          $ref: '#/components/schemas/Name'
        admin_key_expires_at:
          type: string
          format: date-time
          description: Expiry of the first key. Absent means that it does not expire.
    TenantCreated:
      type: object
      additionalProperties: false
      required: [tenant, admin_service_account, admin_key]
      properties:
        tenant: {$ref: '#/components/schemas/Tenant'}
        admin_service_account: {$ref: '#/components/schemas/ServiceAccount'}
        admin_key: {$ref: '#/components/schemas/VirtualKeyCreated'}
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        display_name: {type: string, maxLength: 200}
    TenantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Tenant'}
        next_cursor: {type: string, description: Absent on the last page.}
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, description, state, roles, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ID'}
        tenant_id: {$ref: '#/components/schemas/ID'}
        name: {$ref: '#/components/schemas/Name'}
        description: {type: string}
        state: {$ref: '#/components/schemas/ServiceAccountState'}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        roles:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ServiceAccountCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {type: string, maxLength: 500}
        valid_from: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
        roles:
          type: array
          description: Names of built-in tenant roles.
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    ServiceAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {type: string, maxLength: 500}
        valid_from: {type: [string, "null"], format: date-time}
        valid_until: {type: [string, "null"], format: date-time}
        roles:
          type: array
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}
    ServiceAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ServiceAccount'}
        next_cursor: {type: string, description: Absent on the last page.}
    VirtualKey:
      type: object
      additionalProperties: false
      required: [id, tenant_id, service_account_id, description, state, created_at]
      properties:
        id: {$ref: '#/components/schemas/VirtualKeyID'}
        tenant_id: {$ref: '#/components/schemas/ID'}
        service_account_id: {$ref: '#/components/schemas/ID'}
        description: {type: string}
        credential_id: {$ref: '#/components/schemas/ID'}
        models:
          type: array
          description: Models the key is limited to, as provider/name. Absent means every model available to the tenant.
          items: {$ref: '#/components/schemas/ModelRef'}
        scopes:
          type: array
          description: Permissions the key is limited to. Absent means every permission of the service account's roles.
          items: {type: string}
        state: {$ref: '#/components/schemas/KeyState'}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    VirtualKeyCreate:
      type: object
      additionalProperties: false
      required: [service_account_id]
      properties:
        service_account_id: {$ref: '#/components/schemas/ID'}
        description: {type: string, maxLength: 200}
        credential_id: {$ref: '#/components/schemas/ID'}
        models:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {$ref: '#/components/schemas/ModelRef'}
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {type: string, pattern: '^[a-z_]+:[a-z_]+$'}
        expires_at: {type: string, format: date-time}
    VirtualKeyCreated:
      type: object
      additionalProperties: false
      required: [key, secret]
      properties:
        key: {$ref: '#/components/schemas/VirtualKey'}
        secret: {type: string, description: 'The complete key (pdk_…). It is returned by this response only.'}
    VirtualKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VirtualKey'}
        next_cursor: {type: string, description: Absent on the last page.}
    PlatformKey:
      type: object
      additionalProperties: false
      required: [id, description, role, bootstrap, state, created_at]
      properties:
        id: {$ref: '#/components/schemas/PlatformKeyID'}
        description: {type: string}
        role: {type: string}
        bootstrap: {type: boolean}
        state: {$ref: '#/components/schemas/KeyState'}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    PlatformKeyCreate:
      type: object
      additionalProperties: false
      properties:
        description: {type: string, maxLength: 200}
        expires_at: {type: string, format: date-time}
    PlatformKeyCreated:
      type: object
      additionalProperties: false
      required: [key, secret]
      properties:
        key: {$ref: '#/components/schemas/PlatformKey'}
        secret: {type: string, description: 'The complete key (pdk_…). It is returned by this response only.'}
    PlatformKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PlatformKey'}
        next_cursor: {type: string, description: Absent on the last page.}
