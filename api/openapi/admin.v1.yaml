      summary: Set an operator price for a model
      description: >-
        Adds a version with source override that starts at valid_from (now when absent; never in the past). From then on imports leave the model alone until clearPriceOverride.
      x-pandokos-permission: catalog:price
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceOverride'}}}}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "201": {$ref: '#/components/responses/PriceVersionCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/IdempotencyKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/prices/{price_version}:
    parameters:
      - {$ref: '#/components/parameters/Model'}
      - {$ref: '#/components/parameters/PriceVersion'}
    delete:
      operationId: deletePriceVersion
      tags: [prices]
      summary: Remove a price version that has not started
      description: >-
        Refused with invalid_state once the version is in force or past: versions are immutable. The response is the version as it was.
      x-pandokos-permission: catalog:price
      responses:
        "200": {$ref: '#/components/responses/PriceVersion'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/models/{model}/clear-price-override:
    parameters:
      - {$ref: '#/components/parameters/Model'}
    post:
      operationId: clearPriceOverride
      tags: [prices]
      summary: Let imports price the model again
      description: >-
        Refused with invalid_state while a version of the model has not started. The override in force stays in force until an import creates a version.
      x-pandokos-permission: catalog:price
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/Reason'}}}}
      responses:
        "200": {$ref: '#/components/responses/Model'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/price-imports:
    get:
      operationId: listPriceImports
      tags: [prices]
      summary: List price imports, newest first
      x-pandokos-permission: catalog:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        "200": {$ref: '#/components/responses/PriceImportList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: runPriceImport
      tags: [prices]
      summary: Import prices now
      description: >-
        embedded imports the snapshot of this release; remote downloads pricing.refresh.url and is refused unless pricing.refresh.enabled. With dry_run nothing is written and the response has no id.
      x-pandokos-permission: catalog:price
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PriceImportRun'}}}}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "201": {$ref: '#/components/responses/PriceImportCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/PriceDatasetInvalidOrKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "502": {$ref: '#/components/responses/PriceSourceUnavailable'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/price-imports/{price_import}:
    parameters:
      - {$ref: '#/components/parameters/PriceImport'}
    get:
      operationId: getPriceImport
      tags: [prices]
      summary: Read a price import with its report
      x-pandokos-permission: catalog:read
      responses:
        "200": {$ref: '#/components/responses/PriceImport'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/models:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listTenantModels
      tags: [model-access]
      summary: List the models available to the tenant
      description: >-
        Models the platform made available to the tenant, with allowed false for those outside the tenant's restriction, and the price in force now: price is the catalogue's version in force, tenant_price the version of the tenant's active list; price_source says which applies.
      x-pandokos-permission: model:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: provider, in: query, description: Only models of this provider., schema: {$ref: '#/components/schemas/ProviderName'}}
      responses:
        "200": {$ref: '#/components/responses/TenantModelList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/model-restriction:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: getModelRestriction
      tags: [model-access]
      summary: Read the model restriction of the tenant
      x-pandokos-permission: model:read
      responses:
        "200": {$ref: '#/components/responses/ModelRestriction'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: setModelRestriction
      tags: [model-access]
      summary: Restrict the tenant to the models named
      description: >-
        Every reference must name a model available to the tenant. An empty list allows no model.
      x-pandokos-permission: model:restrict
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRestrictionSet'}}}}
      responses:
        "200": {$ref: '#/components/responses/ModelRestriction'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: clearModelRestriction
      tags: [model-access]
      summary: Remove the model restriction of the tenant
      x-pandokos-permission: model:restrict
      responses:
        "200": {$ref: '#/components/responses/ModelRestriction'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/platform-keys:
    get:
      operationId: listPlatformKeys
      tags: [platform-keys]
      summary: List platform keys
      x-pandokos-permission: platform_key:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Sort'}
        - name: state
          in: query
          description: Only keys in this state.
          schema: {$ref: '#/components/schemas/KeyState'}
      responses:
        "200": {$ref: '#/components/responses/PlatformKeyList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createPlatformKey
      tags: [platform-keys]
      summary: Issue a platform key
      description: >-
        The key is returned once and is stored only as a hash. Its role is platform-admin unless
        role names platform-auditor, a read-only role. Refused with escalation_refused when it would give or take a permission the caller does not hold.
      x-pandokos-permission: platform_key:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlatformKeyCreate'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "201": {$ref: '#/components/responses/PlatformKeyCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/IdempotencyKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/platform-keys/{key}:
    parameters:
      - {$ref: '#/components/parameters/PlatformKey'}
    get:
      operationId: getPlatformKey
      tags: [platform-keys]
      summary: Read the metadata of a platform key
      x-pandokos-permission: platform_key:read
      responses:
        "200": {$ref: '#/components/responses/PlatformKey'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/platform-keys/{key}/revoke:
    parameters:
      - {$ref: '#/components/parameters/PlatformKey'}
    post:
      operationId: revokePlatformKey
      tags: [platform-keys]
      summary: Revoke a platform key
      description: A revocation cannot be undone. Revoking a revoked key succeeds and changes nothing.
      x-pandokos-permission: platform_key:revoke
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/PlatformKey'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/price-lists:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listPriceLists
      tags: [tenant-prices]
      summary: List the price lists of the tenant, one per currency
      x-pandokos-permission: price_list:read
      responses:
        "200": {$ref: '#/components/responses/TenantPriceListList'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/prices:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listPriceListVersions
      tags: [tenant-prices]
      summary: List the price versions of the tenant's price lists, newest first
      description: >-
        A cursor is valid only with the same currency, provider, model and at.
      x-pandokos-permission: price_list:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: currency, in: query, description: Only versions of the list in this currency., schema: {$ref: '#/components/schemas/Currency'}}
        - {name: provider, in: query, description: Only versions for models of this provider., schema: {$ref: '#/components/schemas/ProviderName'}}
        - {name: model, in: query, description: Only versions for the model of this name; needs provider., schema: {$ref: '#/components/schemas/ModelName'}}
        - {name: at, in: query, description: 'An RFC 3339 time: only the versions in force then, one per list and model.', schema: {type: string, minLength: 1, maxLength: 64}}
      responses:
        "200": {$ref: '#/components/responses/TenantPriceVersionList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createPriceListVersion
      tags: [tenant-prices]
      summary: Add a price version to one of the tenant's price lists
      description: >-
        The list is the one of the version's currency; the first version in a currency creates the
        list. The version starts at valid_from (now when absent; never in the past). While the
        currency is the tenant's active currency it is the price of the tenant's requests for the
        model, in place of the catalogue price in that currency; in another currency it is kept and
        unused. kind end takes no rates: from its start the list does not price the model. The
        model must be available to the tenant.
      x-pandokos-permission: price_list:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TenantPriceCreate'}}}}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "201": {$ref: '#/components/responses/TenantPriceVersionCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/IdempotencyKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/prices/{price}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/TenantPrice'}
    get:
      operationId: getPriceListVersion
      tags: [tenant-prices]
      summary: Read a price version of the tenant's price lists
      description: >-
        Any version, past ones included: the one a usage record names with price_source tenant.
      x-pandokos-permission: price_list:read
      responses:
        "200": {$ref: '#/components/responses/TenantPriceVersion'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deletePriceListVersion
      tags: [tenant-prices]
      summary: Remove a price version of the tenant's lists that has not started
      description: >-
        Refused with invalid_state once the version is in force or past: versions are immutable.
        The response is the version as it was.
      x-pandokos-permission: price_list:delete
      responses:
        "200": {$ref: '#/components/responses/TenantPriceVersion'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/active-currency:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: getActiveCurrency
      tags: [tenant-prices]
      summary: Read the currency every cost of the tenant is computed in
      x-pandokos-permission: price_list:read
      responses:
        "200": {$ref: '#/components/responses/ActiveCurrency'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: setActiveCurrency
      tags: [tenant-prices]
      summary: Choose the currency every cost of the tenant is computed in
      description: >-
        The currency must have a list: prices of the tenant in it, or catalogue prices in it. The
        change takes effect at the start of the next month in the tenant's time zone; until then
        effective_from says when. Setting the currency in force again withdraws a pending change.
        An empty currency is the default of the installation. From the change on, only budgets and
        ceilings in the new currency apply; inactive_limits names the others.
      x-pandokos-permission: tenant_setting:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActiveCurrencySet'}}}}
      responses:
        "200": {$ref: '#/components/responses/ActiveCurrency'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/capability:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: getCapability
      tags: [model-access]
      summary: Say whether the tenant can call a provider and model now
      description: >-
        Evaluates, on committed state, the rules the gateway applies to a call made with a key of
        the tenant that has no pin and no model list: the provider is available, the model is
        allowed, and the tenant has an active default credential for the provider. provider and
        model are required. A tenant that is not active is answered 403 tenant_suspended.
      x-pandokos-permission: model:read
      parameters:
        - {name: provider, in: query, description: The provider. Required., schema: {$ref: '#/components/schemas/ProviderName'}}
        - {name: model, in: query, description: The public model name. Required., schema: {$ref: '#/components/schemas/ModelName'}}
      responses:
        "200": {$ref: '#/components/responses/Capability'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/usage-records:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listUsageRecords
      tags: [usage]
      summary: List the tenant's usage records, newest first
      description: >-
        Records whose started_at is in [from, to). to defaults to now and from to 24 hours before to;
        the window is at most 31 days. A cursor is valid only with the same from, to, provider and limit_state.
      x-pandokos-permission: usage:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: from, in: query, description: 'Start of the window, RFC 3339.', schema: {type: string, maxLength: 64}}
        - {name: to, in: query, description: 'End of the window (excluded), RFC 3339.', schema: {type: string, maxLength: 64}}
        - {name: provider, in: query, description: Only records of this provider., schema: {$ref: '#/components/schemas/ProviderName'}}
        - {name: limit_state, in: query, description: Only records with this limit state., schema: {$ref: '#/components/schemas/LimitState'}}
      responses:
        "200": {$ref: '#/components/responses/UsageRecordList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/token-issuers:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listTokenIssuers
      tags: [token-issuers]
      summary: List the trusted token issuers of a tenant
      x-pandokos-permission: token_issuer:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/NamedSort'}
        - {name: name, in: query, description: Only the registration with exactly this name., schema: {$ref: '#/components/schemas/Name'}}
        - {name: enabled, in: query, description: Only registrations that are enabled (true) or disabled (false)., schema: {$ref: '#/components/schemas/EnabledFilter'}}
      responses:
        "200": {$ref: '#/components/responses/TokenIssuerList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createTokenIssuer
      tags: [token-issuers]
      summary: Register a trusted token issuer
      description: >-
        Tokens of the issuer that carry the audience are accepted for this tenant. The pair of issuer and audience
        is unique in the installation; a pair already taken is a conflict.
      x-pandokos-permission: token_issuer:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenIssuerCreate'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        "201": {$ref: '#/components/responses/TokenIssuerCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/IdempotencyKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/token-issuers/{issuer}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/TokenIssuer'}
    get:
      operationId: getTokenIssuer
      tags: [token-issuers]
      summary: Read a trusted token issuer
      x-pandokos-permission: token_issuer:read
      responses:
        "200": {$ref: '#/components/responses/TokenIssuer'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
