      responses:
        "200": {$ref: '#/components/responses/PasswordReset'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/members/{user}/revoke-sessions:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/User'}
    post:
      operationId: revokeMemberSessions
      tags: [members]
      summary: End every session of a member
      x-pandokos-permission: member:write
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/SessionsRevoked'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/permissions:
    get:
      operationId: listPermissions
      tags: [roles]
      summary: The permission catalogue
      x-pandokos-permission: identity:read
      responses:
        "200": {$ref: '#/components/responses/PermissionList'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/roles:
    get:
      operationId: listBuiltinRoles
      tags: [roles]
      summary: The built-in roles of tenants and of the platform
      x-pandokos-permission: identity:read
      responses:
        "200": {$ref: '#/components/responses/BuiltinRoleList'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/roles:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listRoles
      tags: [roles]
      summary: List the custom roles of a tenant
      x-pandokos-permission: role:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/NamedSort'}
        - name: state
          in: query
          description: Only roles in this state.
          schema: {$ref: '#/components/schemas/RoleState'}
      responses:
        "200": {$ref: '#/components/responses/RoleList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createRole
      tags: [roles]
      summary: Define a custom role
      description: >-
        The caller must hold every permission of the role (escalation_refused otherwise). The name
        cannot be changed later, cannot be the name of a built-in role and cannot start with
        platform- or pandokos-.
      x-pandokos-permission: role:write
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleCreate'}
      responses:
        "201": {$ref: '#/components/responses/RoleCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/IdempotencyKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/roles/{role}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Role'}
    get:
      operationId: getRole
      tags: [roles]
      summary: Read a custom role and how many identities hold it
      x-pandokos-permission: role:read
      responses:
        "200": {$ref: '#/components/responses/Role'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Change the description or the permissions of a custom role
      description: >-
        The change holds for every holder: for members at their next request, for keys and tokens
        when the gateways drop their cached principals. The caller must hold every permission the
        role has and will have. Refused with escalation_refused when it would give or take a
        permission the caller does not hold.
      x-pandokos-permission: role:write
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoleUpdate'}
      responses:
        "200": {$ref: '#/components/responses/Role'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a custom role that nobody holds
      description: >-
        The caller must hold every permission of the role. Refused with escalation_refused when it
        would give or take a permission the caller does not hold.
      x-pandokos-permission: role:delete
      responses:
        "204": {$ref: '#/components/responses/Deleted'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/RoleInUse'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/roles/{role}/deactivate:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Role'}
    post:
      operationId: deactivateRole
      tags: [roles]
      summary: Deactivate a custom role
      description: >-
        Holders keep the assignment and lose the permissions; the role cannot be assigned.
        Deactivating an inactive role succeeds and changes nothing. Refused with escalation_refused
        when it would give or take a permission the caller does not hold.
      x-pandokos-permission: role:write
      x-pandokos-reason: required
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequiredReason'}
      responses:
        "200": {$ref: '#/components/responses/Role'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/roles/{role}/activate:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/Role'}
    post:
      operationId: activateRole
      tags: [roles]
      summary: Activate a custom role
      description: >-
        Holders get the permissions of the role again, and the role can be assigned. Activating an
        active role succeeds and changes nothing. Refused with escalation_refused when it would give
        or take a permission the caller does not hold.
      x-pandokos-permission: role:write
      x-pandokos-reason: required
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequiredReason'}
      responses:
        "200": {$ref: '#/components/responses/Role'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenant-support/{tenant}/actions:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listTenantSupportActions
      tags: [tenant-support]
      summary: List the support actions of a tenant as a platform principal
      x-pandokos-permission: tenant_support:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/SupportActionSort'}}
        - {name: state, in: query, description: 'open, or closed for every other state.', schema: {$ref: '#/components/schemas/SupportActionFilter'}}
      responses:
        "200": {$ref: '#/components/responses/SupportActionList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: openSupportAction
      tags: [tenant-support]
      summary: Open a support action in a tenant
      description: >-
        Lets the caller act in the tenant with the listed permissions until the action expires or is
        closed. The reason, the permissions and every change made under the action are recorded in
        the tenant's audit log; the tenant sees the action and its owner can end it. An open action
        of the same caller in the tenant is closed first. No permission that reads usage, prices or
        secrets can be listed. Refused with support_disabled when the installation switched support
        actions off.
      x-pandokos-permission: tenant_support:open
      x-pandokos-reason: required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupportActionOpen'}
      responses:
        "201": {$ref: '#/components/responses/SupportActionCreated'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "422": {$ref: '#/components/responses/IdempotencyKeyReused'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenant-support/{tenant}/actions/{action}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/SupportAction'}
    get:
      operationId: getTenantSupportAction
      tags: [tenant-support]
      summary: Read a support action as a platform principal
      x-pandokos-permission: tenant_support:read
      responses:
        "200": {$ref: '#/components/responses/SupportAction'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenant-support/{tenant}/actions/{action}/close:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/SupportAction'}
    post:
      operationId: closeSupportAction
      tags: [tenant-support]
      summary: Close a support action
      description: >-
        Closing an action that is closed or expired succeeds and changes nothing.
      x-pandokos-permission: tenant_support:open
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/SupportAction'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/support-actions:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
    get:
      operationId: listSupportActions
      tags: [support-actions]
      summary: List the support actions of the platform in a tenant
      x-pandokos-permission: support_action:read
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: sort, in: query, schema: {$ref: '#/components/schemas/SupportActionSort'}}
        - {name: state, in: query, description: 'open, or closed for every other state.', schema: {$ref: '#/components/schemas/SupportActionFilter'}}
      responses:
        "200": {$ref: '#/components/responses/SupportActionList'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/support-actions/{action}:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/SupportAction'}
    get:
      operationId: getSupportAction
      tags: [support-actions]
      summary: Read a support action of the platform in a tenant
      x-pandokos-permission: support_action:read
      responses:
        "200": {$ref: '#/components/responses/SupportAction'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
  /v1/tenants/{tenant}/support-actions/{action}/end:
    parameters:
      - {$ref: '#/components/parameters/Tenant'}
      - {$ref: '#/components/parameters/SupportAction'}
    post:
      operationId: endSupportAction
      tags: [support-actions]
      summary: End a support action of the platform in a tenant
      description: >-
        Ending an action that is closed or expired succeeds and changes nothing.
      x-pandokos-permission: support_action:end
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Reason'}
      responses:
        "200": {$ref: '#/components/responses/SupportAction'}
        "400": {$ref: '#/components/responses/InvalidRequest'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "413": {$ref: '#/components/responses/RequestTooLarge'}
        "415": {$ref: '#/components/responses/UnsupportedMediaType'}
        "500": {$ref: '#/components/responses/Internal'}
        "503": {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    key:
      type: http
      scheme: bearer
      description: A virtual key or a platform key (pdk_…).
    session:
      type: apiKey
      in: cookie
      name: __Host-pandokos_session
      description: The session of a person who signed in (cookie set by signIn).
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Tenant ID.
      schema: {$ref: '#/components/schemas/ID'}
    ServiceAccount:
      name: service_account
      in: path
      required: true
      description: Service account ID.
      schema: {$ref: '#/components/schemas/ID'}
    Role:
      name: role
      in: path
      required: true
      description: Name of a custom role of the tenant.
      schema: {$ref: '#/components/schemas/RoleName'}
    SupportAction:
      name: action
      in: path
      required: true
      description: Support action ID.
      schema: {$ref: '#/components/schemas/ID'}
    VirtualKey:
      name: key
      in: path
      required: true
      description: Key ID of a virtual key (the public part of the key).
      schema: {$ref: '#/components/schemas/VirtualKeyID'}
    PlatformKey:
      name: key
      in: path
      required: true
      description: Key ID of a platform key (the public part of the key).
      schema: {$ref: '#/components/schemas/PlatformKeyID'}
    Credential:
      name: credential
      in: path
      required: true
      description: Credential ID.
      schema: {$ref: '#/components/schemas/ID'}
    Provider:
      name: provider
      in: path
      required: true
      description: Name of a provider.
      schema: {$ref: '#/components/schemas/ProviderName'}
    Endpoint:
      name: endpoint
      in: path
      required: true
      description: Name of an endpoint of the provider.
      schema: {$ref: '#/components/schemas/Name'}
    Model:
      name: model
      in: path
      required: true
      description: Model ID.
      schema: {$ref: '#/components/schemas/ID'}
    PriceVersion:
      name: price_version
      in: path
      required: true
      description: Price version ID.
      schema: {$ref: '#/components/schemas/ID'}
    TenantPrice:
      name: price
      in: path
      required: true
      description: ID of a price version of the tenant's price lists.
      schema: {$ref: '#/components/schemas/ID'}
    PriceImport:
      name: price_import
      in: path
      required: true
      description: Price import ID.
      schema: {$ref: '#/components/schemas/ID'}
    TokenIssuer:
      name: issuer
      in: path
      required: true
      description: ID of a trusted token issuer.
      schema: {$ref: '#/components/schemas/ID'}
    SubjectMapping:
      name: mapping
      in: path
      required: true
      description: ID of a subject mapping.
      schema: {$ref: '#/components/schemas/ID'}
    PlatformIssuer:
      name: issuer
      in: path
      required: true
      description: ID of a platform-level token issuer.
      schema: {$ref: '#/components/schemas/ID'}
    LimitRule:
      name: rule
      in: path
      required: true
      description: ID of a limit rule of the tenant.
      schema: {$ref: '#/components/schemas/ID'}
    PlatformLimitRule:
      name: rule
      in: path
      required: true
      description: ID of a platform limit rule.
      schema: {$ref: '#/components/schemas/ID'}
    User:
      {name: user, in: path, required: true, description: User ID., schema: {$ref: '#/components/schemas/ID'}}
    Session:
      {name: session, in: path, required: true, description: Session ID., schema: {$ref: '#/components/schemas/ID'}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: >-
        Makes a retry of this request safe. A second request with the same key, by the same
        principal, on the same operation and body returns the first response (header
        Idempotency-Replayed) without the members that are shown once.
      schema: {type: string, pattern: '^[\x21-\x7e]{1,128}$'}
    OidcCode:
      {name: code, in: query, description: Authorization code of the identity provider., schema: {type: string, maxLength: 4096}}
    OidcState:
      {name: state, in: query, description: The state of the sign-in transaction., schema: {type: string, maxLength: 4096}}
    OidcError:
      {name: error, in: query, description: Error code of the identity provider., schema: {type: string, maxLength: 4096}}
    OidcIssuer:
      {name: iss, in: query, description: Issuer that the identity provider names in its answer., schema: {type: string, maxLength: 4096}}
    UserSort:
      name: sort
      in: query
      description: Order of the items. A leading minus means descending.
      schema: {$ref: '#/components/schemas/UserSort'}
    UserState:
      name: state
      in: query
      description: Only users in this state.
      schema: {$ref: '#/components/schemas/UserState'}
    UsernameFilter:
      name: username
      in: query
      description: Only the user with exactly this username.
      schema: {$ref: '#/components/schemas/Username'}
    Limit:
      name: limit
      in: query
      description: Maximum number of items in the page.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page. It is valid only with the same sort and filters.
      schema: {type: string, minLength: 1, maxLength: 512}
    Sort:
      name: sort
      in: query
      description: Order of the items. A leading minus means descending.
      schema: {$ref: '#/components/schemas/Sort'}
    NamedSort:
      name: sort
      in: query
      description: Order of the items. A leading minus means descending.
      schema: {$ref: '#/components/schemas/NamedSort'}
  responses:
    Me:
      description: The caller.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Me'}
    Tenant:
      description: The tenant.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Tenant'}
    TenantCreated:
      description: The tenant, its first service account and that account's key.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TenantCreated'}
    TenantList:
      description: One page of tenants.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TenantList'}
    ServiceAccount:
      description: The service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    ServiceAccountCreated:
      description: The new service account.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccount'}
    ServiceAccountList:
      description: One page of service accounts.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServiceAccountList'}
    VirtualKey:
      description: The metadata of the key. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VirtualKey'}
    VirtualKeyCreated:
      description: The new key and, this once, its secret.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VirtualKeyCreated'}
    VirtualKeyList:
      description: One page of virtual keys.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VirtualKeyList'}
    PlatformKey:
      description: The metadata of the key. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformKey'}
    PlatformKeyCreated:
      description: The new key and, this once, its secret.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformKeyCreated'}
    PlatformKeyList:
      description: One page of platform keys.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformKeyList'}
    Credential:
      description: The metadata of the credential. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Credential'}
    CredentialCreated:
      description: The metadata of the new credential. The secret is never returned.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Credential'}
    CredentialList:
      description: One page of credentials (metadata).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CredentialList'}
    CredentialRejected:
      description: 'The provider refused the secret; nothing was stored. Code: credential_rejected.'
      content:
        application/problem+json:
