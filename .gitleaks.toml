# Secret scanning of the repository and of its history: `make secrets`, run in CI.
# The default rules of gitleaks cover provider keys and other common secrets; the rules below add
# the keys, session tokens and signing secrets Pandokos issues (docs/operations/keys.md). Never allowlist a real key: revoke it.
title = "pandokos"

[extend]
useDefault = true

[[rules]]
id = "pandokos-key"
description = "Pandokos platform or virtual key"
regex = '''pdk_[tp][a-z2-7]{16}_[a-z2-7]{59}'''
keywords = ["pdk_"]

[[rules]]
id = "pandokos-session"
description = "Pandokos session token"
regex = '''pds_[A-Za-z0-9_-]{43}'''
keywords = ["pds_"]

[[rules]]
id = "pandokos-signing-secret"
description = "Pandokos webhook signing secret"
regex = '''whsec_[A-Za-z0-9+/]{43}='''
keywords = ["whsec_"]

# Test values are synthetic and named so (`synthetic-…`, docs/operations/vault.md, plan rule 3);
# the generic rule of gitleaks flags them in test request bodies. Only that prefix is allowed.
[[allowlists]]
description = "Synthetic secrets of the test suites"
regexTarget = "secret"
regexes = ['''^\s*synthetic-[a-z0-9-]*(\\x07)?[a-z0-9-]*(\\n)?\s*$''']

# False positive: the generic rule reads a list of package names in a repository test as a key
# (commit 7fcccb6, already in history). Only that file and that statement are allowed.
[[allowlists]]
description = "Package list of the people imports test"
paths = ['''^test/repo/people_test\.go$''']
regexTarget = "line"
regexes = ['''^\s*forbidden := \[\]string\{"internal/gateway", "internal/resolver",''']

# False positive: the generic rule reads the synthetic hash argument of record_auth_failure in an
# isolation test as a key (commit 8281057, already in history). Only that file and that call.
[[allowlists]]
description = "Synthetic hash in the closed-tenant isolation test"
paths = ['''^test/isolation/tenant_open_test\.go$''']
regexTarget = "line"
regexes = ['''pandokos\.record_auth_failure\('tabcdefghijklmnop', 'bad_secret', '0123456789abcdef0123456789abcdef'\)''']

# False positive: the generic rule reads the name of an encryption algorithm in the design of sprint 12.1
# as a key (commit 736fa02, already in history). Only that file and that statement are allowed.
[[allowlists]]
description = "Algorithm names in the design of the external key-encryption key"
paths = ['''^planning/epics/12-operability/12\.1-external-key-encryption-key/sprint\.md$''']
regexTarget = "line"
regexes = ['''`chacha20-poly1305` and for a derived key''']

# False positive: a synthetic signing secret that the fake of the declarative tests returns once, so that a
# test can prove it reaches the secret sink only (commit eae9526, already in history). Only that file and that constant.
[[allowlists]]
description = "Synthetic signing secret of the declarative fake"
paths = ['''^internal/declare/fake_test\.go$''']
regexTarget = "line"
regexes = ['''^const canarySigningSecret = "whsec_c3ludGhldGljLWNhbmFyeS1zaWduaW5nLXNlY3JldC0wMDAx="$''']
