version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        all:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/pandokos/pandokos
            - go.yaml.in/yaml/v3
            - github.com/jackc/pgx/v5
            - go/ast
            - go/format
            - go/parser
            - go/token
        pgx-only-in-store:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/internal/**"
            - "!**/internal/store/**"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: only internal/store talks to the database; use store.DB
        store-takes-plain-values:
          list-mode: lax
          files:
            - "**/internal/store/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/config
              desc: the store receives plain values through ConnOptions
            - pkg: github.com/pandokos/pandokos/internal/server
              desc: the store does not know the server
            - pkg: github.com/pandokos/pandokos/internal/gateway
              desc: the store does not know the gateway
        tenant-is-a-leaf:
          list-mode: lax
          files:
            - "**/internal/tenant/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/internal
              desc: the tenant package imports only the standard library
            - pkg: github.com/jackc/pgx/v5
              desc: the tenant package has no database code
        product-does-not-import-tests:
          list-mode: lax
          files:
            - "**/cmd/**"
            - "**/internal/**"
            - "!**/test/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/test
              desc: product code must not import test helpers
        family-is-a-leaf:
          list-mode: lax
          files:
            - "**/internal/family/**"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/gateway
              desc: families do not know the gateway
            - pkg: github.com/pandokos/pandokos/internal/server
              desc: families do not know the server
            - pkg: github.com/pandokos/pandokos/internal/config
              desc: families receive plain values
        gateway-takes-plain-values:
          list-mode: lax
          files:
            - "**/internal/gateway/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/server
              desc: the gateway does not know the server
            - pkg: github.com/pandokos/pandokos/internal/config
              desc: the gateway receives plain values through Options
            - pkg: github.com/pandokos/pandokos/internal/admin
              desc: the planes do not import each other (ADR 0003)
            - pkg: github.com/pandokos/pandokos/internal/authn
              desc: the gateway sees authentication through gateway.Authenticator
            - pkg: github.com/pandokos/pandokos/internal/cli
              desc: the gateway does not know the CLI
            - pkg: github.com/pandokos/pandokos/internal/store
              desc: the gateway does not reach the database itself
            - pkg: github.com/pandokos/pandokos/internal/resolver
              desc: the gateway sees the catalogue and the vault through its own ports
            - pkg: github.com/pandokos/pandokos/internal/egress
              desc: the gateway receives round trippers through Options
            - pkg: github.com/pandokos/pandokos/internal/vault
              desc: the gateway sees credentials through gateway.Credentials
            - pkg: github.com/pandokos/pandokos/internal/catalog
              desc: the gateway sees the catalogue through gateway.Catalogue
        egress-is-a-leaf:
          list-mode: strict
          files:
            - "**/internal/egress/**"
            - "!$test"
          allow:
            - $gostd
        resolver-is-wiring:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/resolver/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/resolver
              desc: only the command composes the resolver (ADR 0037)
        admin-takes-plain-values:
          list-mode: lax
          files:
            - "**/internal/admin/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/gateway
              desc: the planes do not import each other (ADR 0003)
            - pkg: github.com/pandokos/pandokos/internal/family
              desc: families belong to the data plane
            - pkg: github.com/pandokos/pandokos/internal/server
              desc: the handlers do not know the server
            - pkg: github.com/pandokos/pandokos/internal/config
              desc: the handlers receive plain values through Options
        adminapi-is-standard-library-only:
          list-mode: strict
          files:
            - "**/internal/adminapi/**"
            - "!$test"
          allow:
            - $gostd
        authz-is-a-leaf:
          list-mode: strict
          files:
            - "**/internal/authz/**"
            - "**/internal/requestid/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/pandokos/pandokos/internal/tenant
        pricing-is-pure:
          list-mode: lax
          files:
            - "**/internal/pricing/**"
            - "!$test"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/store
              desc: pricing is arithmetic and parsing; it does not reach the database
            - pkg: net
              desc: pricing does no network I/O
            - pkg: net/http
              desc: pricing does no network I/O; the catalogue downloads a dataset
            - pkg: os
              desc: pricing does no file I/O; the caller reads the dataset
        catalog-is-below-the-planes:
          list-mode: lax
          files:
            - "**/internal/catalog/**"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/admin
              desc: the catalogue is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/adminapi
              desc: the catalogue is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/gateway
              desc: the catalogue is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/server
              desc: the catalogue does not know the server
            - pkg: github.com/pandokos/pandokos/internal/cli
              desc: the catalogue does not know the CLI
            - pkg: github.com/pandokos/pandokos/internal/config
              desc: the catalogue receives plain values
            - pkg: github.com/pandokos/pandokos/internal/vault
              desc: the catalogue holds no secret
        cli-is-a-client:
          list-mode: strict
          files:
            - "**/internal/cli/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/pandokos/pandokos/internal/adminapi
            - github.com/pandokos/pandokos/internal/secret
            - github.com/pandokos/pandokos/internal/buildinfo
        vault-is-below-the-planes:
          list-mode: lax
          files:
            - "**/internal/vault/**"
          deny:
            - pkg: github.com/pandokos/pandokos/internal/admin
              desc: the vault is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/adminapi
              desc: the vault is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/gateway
              desc: the vault is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/family
              desc: the vault is used by the planes and does not know them
            - pkg: github.com/pandokos/pandokos/internal/server
              desc: the vault does not know the server
            - pkg: github.com/pandokos/pandokos/internal/cli
              desc: the vault does not know the CLI
            - pkg: github.com/pandokos/pandokos/internal/config
              desc: the vault receives plain values
        encryption-only-in-vault:
          list-mode: lax
          files:
            - $all
            - "!**/internal/vault/**"
          deny:
            - pkg: crypto/aes
              desc: sealing and unsealing live in internal/vault only (ADR 0008)
            - pkg: crypto/cipher
              desc: sealing and unsealing live in internal/vault only (ADR 0008)
            - pkg: crypto/hkdf
              desc: key derivation lives in internal/vault only (ADR 0008)
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
          msg: write to the injected io.Writer or use the slog logger
        - pattern: '^log\.(Print|Fatal|Panic)(|f|ln)$'
          msg: use log/slog
        - pattern: '^httputil\.Dump(Request|RequestOut|Response)$'
          msg: dumps contain credentials and content
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: context-as-argument
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
          - unparam
      - path: ^test/
        linters:
          - gosec
          - noctx
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pandokos/pandokos
