version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /test/sdk
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /test/transit
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    # The PostgreSQL servers of the test database, of the identity provider suite and of the restore drill
    # share their digests (test/repo): one entry and one group, so that a new digest reaches all of them in
    # one pull request. Their floor is PostgreSQL 16 (ADR 0075): a new major is a decision, not an update;
    # patch and digest updates still come. The later major (18) of test/db/compose.pg18.yaml and of the
    # drill is in the same group.
    directories:
      - /test/db
      - /test/idp
      - /test/drill
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      postgres:
        patterns: ["postgres"]
  - package-ecosystem: pip
    directory: /test/sdk/python
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /test/sdk/ts
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/compose/observability
    schedule:
      interval: weekly
