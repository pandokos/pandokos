name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
      - run: make fmt-check
      - run: make vet
      - run: make tidy
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          # Built with the Go of setup-go: the released binary of v2.5.0 is built with Go 1.25 and
          # refuses a module whose floor is Go 1.26.
          install-mode: goinstall

  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - run: make generate-check

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: floor
            go-version: "1.26.11"
            go-version-file: ""
          - name: release
            go-version: ""
            go-version-file: .go-version
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go test -race -count=1 -timeout 30m ./...
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200

  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: test/sdk/go.sum
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - run: go vet ./...
        working-directory: test/sdk
      - run: go mod tidy -diff
        working-directory: test/sdk
      - run: go test -race -count=1 -timeout 30m ./...
        working-directory: test/sdk
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200

  idp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - name: Start Keycloak, Hydra and Authentik
        run: make idp-up
      - name: Trusted issuer and people tests
        run: make test-idp
      - name: Identity provider logs
        if: failure()
        run: docker compose -p pandokos-testidp logs --no-color --tail 200
      - name: Stop the identity providers
        if: always()
        run: make idp-down
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200

  transit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vendor: [openbao, vault]
    name: transit (${{ matrix.vendor }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - name: Start the key service
        run: |
          make transit-up VENDOR=${{ matrix.vendor }}
          echo "::add-mask::$(cat local/transit/root_token)"
      - name: Key service tests
        run: make test-transit
      - name: Key service logs
        if: failure()
        run: |
          PANDOKOS_TEST_TRANSIT_ROOT_TOKEN=unused PANDOKOS_TEST_TRANSIT_PORT=0 \
            docker compose -f test/transit/compose.yaml -p pandokos-testtransit --profile ${{ matrix.vendor }} logs --no-color --tail 200
      - name: Stop the key service
        if: always()
        run: make transit-down
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200

  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - name: Build the previous release
        run: make previous-binary
      - name: Upgrade tests
        run: make test-upgrade
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200

  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Restore drill
        run: make test-drill
        env:
          PANDOKOS_DRILL_REPORT: ${{ runner.temp }}/drill-report.json
          PANDOKOS_DRILL_AUDIT_ROWS: "1000"
      - name: Leftover containers
        if: always()
        run: docker ps -a --filter name=pandokos-drill --format '{{.Names}} {{.Status}}'

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - run: make build
      # Chrome is on the runner image; the tests fail, they do not skip, without it.
      - run: google-chrome --version
      - run: make test-browser
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200

  sdk-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: test/sdk/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the locked packages
        run: |
          python -m venv local/sdk-venv
          local/sdk-venv/bin/pip install --require-hashes --no-deps --only-binary :all: -r test/sdk/python/requirements.txt
      - run: make test-sdk-python

  sdk-ts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: test/sdk/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: make test-sdk-ts

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...
        working-directory: test/sdk

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - run: make fuzz FUZZTIME=10s

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - run: make secrets

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pandokos:ci
          provenance: false
          sbom: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: Start PostgreSQL and PgBouncer
        run: |
          sh test/db/up.sh
          echo "::add-mask::$(cat local/testdb/postgres_password)"
          cat local/testdb/env >> "$GITHUB_ENV"
      - name: Container tests
        run: go test -tags container -count=1 ./test/container/
        env:
          PANDOKOS_TEST_IMAGE: pandokos:ci
      - name: Compose quick-start
        run: go test -tags compose -count=1 -timeout 25m ./test/compose/
        env:
          PANDOKOS_TEST_IMAGE: pandokos:ci
      - name: Database logs
        if: failure()
        run: docker compose -f test/db/compose.yaml logs --no-color --tail 200
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pandokos:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-ci.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pandokos:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
