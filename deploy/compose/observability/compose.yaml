# Observability overlay for the Pandokos reference deployment: an OpenTelemetry Collector, Prometheus
# and Grafana with two example dashboards. An example to look at the metrics, not a hardened
# monitoring stack. Start it from the directory above:
#
#   docker compose -f compose.yaml -f observability/compose.yaml up -d --wait
#
# Paths are relative to the first file (the project directory), not to this one. Guide:
# docs/operations/compose.md and docs/operations/telemetry.md.

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  otel-collector:
    <<: *hardened
    image: otel/opentelemetry-collector:0.165.0@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    # The egress network is how Pandokos reaches the collector; nothing is published on the host.
    networks: [observability, egress]

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability, publish]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  grafana:
    <<: *hardened
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_admin]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [observability, publish]
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  pandokos:
    environment:
      PANDOKOS_TELEMETRY_OTLP_ENDPOINT: http://otel-collector:4318
      PANDOKOS_TELEMETRY_METRICS_EXPORT_INTERVAL: 10s
      PANDOKOS_TELEMETRY_METRICS_PROMETHEUS: "true"

secrets:
  grafana_admin: {file: ./secrets/grafana_admin}

volumes:
  prometheus-data: {}
  grafana-data: {}

networks:
  # The three observability services talk here; no way out.
  observability: {internal: true}
  # Docker publishes a port only for a container with a route out of the host, so Prometheus and
  # Grafana, which publish on 127.0.0.1, also join this network.
  publish: {}
