receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch: {}
exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls: {insecure: true}
  debug:
    verbosity: basic
service:
  pipelines:
    metrics: {receivers: [otlp], processors: [batch], exporters: [otlphttp/prometheus]}
    traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
